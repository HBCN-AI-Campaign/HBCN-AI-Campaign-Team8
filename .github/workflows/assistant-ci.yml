name: Assistant checks

on:
  push:
    paths:
      - ".github/workflows/assistant-ci.yml"
      - "code/backend/**"
      - "code/assistant-sdk/**"
      - "code/assistant-runtime/**"
      - "code/frontend/**"
      - "code/rag-service/API_CONTRACT.md"
  pull_request:
    paths:
      - ".github/workflows/assistant-ci.yml"
      - "code/backend/**"
      - "code/assistant-sdk/**"
      - "code/assistant-runtime/**"
      - "code/frontend/**"
      - "code/rag-service/API_CONTRACT.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assistant-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assistant:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            code/backend/requirements.txt
            code/backend/requirements-assistant.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements-assistant.txt
        working-directory: code/backend

      - name: Run assistant backend regression
        run: >-
          python -m unittest
          tests.test_assistant_api
          tests.test_assistant_knowledge
          tests.test_assistant_collaboration
          tests.test_assistant_atomic
          tests.test_assistant_contract
          tests.test_assistant_evidence
          tests.test_assistant_preflight
          tests.test_assistant_timestamps
        working-directory: code/backend
        env:
          PYTHONPATH: ${{ github.workspace }}/code/assistant-sdk

      - name: Run SDK tests
        run: python -m unittest discover -s ../assistant-sdk/tests
        working-directory: code/backend
        env:
          PYTHONPATH: ${{ github.workspace }}/code/assistant-sdk

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: code/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: code/frontend

      - name: Run frontend tests
        run: npm test
        working-directory: code/frontend

      - name: Build frontend
        run: npm run build
        working-directory: code/frontend

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Install OpenCode runtime dependencies
        run: bun install --frozen-lockfile --ignore-scripts
        working-directory: code/assistant-runtime

      - name: Test OpenCode runtime
        run: bun test
        working-directory: code/assistant-runtime

      - name: Type-check OpenCode runtime
        run: bun run typecheck
        working-directory: code/assistant-runtime

      - name: Build OpenCode runtime
        run: bun run build
        working-directory: code/assistant-runtime
