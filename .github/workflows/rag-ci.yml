name: RAG checks

on:
  push:
    paths:
      - ".github/workflows/rag-ci.yml"
      - "code/rag-service/**"
  pull_request:
    paths:
      - ".github/workflows/rag-ci.yml"
      - "code/rag-service/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rag-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rag-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hbcn_rag_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hbcn_rag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      HBCN_TEST_POSTGRES: "1"
      RAG_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/hbcn_rag_test?sslmode=disable
      RAG_DATABASE_SCHEMA: hbcn_rag_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/rag-service/requirements-dev.txt

      - name: Install RAG dependencies
        run: python -m pip install -r requirements-dev.txt
        working-directory: code/rag-service

      - name: Verify disposable PostgreSQL target
        run: python scripts/postgres_test_prereqs.py
        working-directory: code/rag-service

      - name: Run complete RAG backend suite including PostgreSQL integration
        run: python -m unittest discover -s tests
        working-directory: code/rag-service

      - name: Check OpenAPI and installed dependencies
        run: |
          python scripts/export-openapi.py --check
          python -m pip check
        working-directory: code/rag-service
