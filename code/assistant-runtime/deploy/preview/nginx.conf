worker_processes 1;
pid /tmp/huiyan-preview-nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log off;
    default_type application/octet-stream;
    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/json json;
        application/wasm wasm;
        application/pdf pdf;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/x-icon ico;
        font/woff2 woff2;
    }
    client_body_temp_path /var/lib/hbcn-assistant-preview/nginx-client;
    proxy_temp_path /var/lib/hbcn-assistant-preview/nginx-proxy;
    fastcgi_temp_path /var/lib/hbcn-assistant-preview/nginx-fastcgi;
    uwsgi_temp_path /var/lib/hbcn-assistant-preview/nginx-uwsgi;
    scgi_temp_path /var/lib/hbcn-assistant-preview/nginx-scgi;

    server {
        listen 127.0.0.1:5174;
        server_name localhost;
        root /opt/hbcn-assistant-preview/current/code/frontend/dist;

        location ~ ^/(api|pdf|uploads)/ {
            proxy_pass http://127.0.0.1:8003;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
