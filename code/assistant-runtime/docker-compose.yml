services:
  assistant-runtime:
    build:
      context: .
    env_file:
      - .env
    environment:
      ASSISTANT_RUNTIME_HOST: 0.0.0.0
      ASSISTANT_RUNTIME_MAX_CONCURRENT_RUNS: ${ASSISTANT_RUNTIME_MAX_CONCURRENT_RUNS:-4}
      # HSBC Model Studio is reached directly; strip any host-injected proxy.
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: "*"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8090:8090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8090/healthz').then(async r => { const x = await r.json(); process.exit(r.ok && x.configured ? 0 : 1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
