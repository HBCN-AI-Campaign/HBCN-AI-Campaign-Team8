[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hbcn-assistant-client"
version = "1.0.0"
description = "HTTP client for the Huiyan assistant V1 business API"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28.1,<1"]

[tool.setuptools.packages.find]
include = ["hbcn_assistant*"]
