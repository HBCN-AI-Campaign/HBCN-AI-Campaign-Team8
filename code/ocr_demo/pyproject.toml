[project]
name = "ocr-demo"
version = "0.1.0"
description = "轻量 OCR 文档识别 Demo（PaddleOCR + 轻量文档解析）"
requires-python = ">=3.10,<3.14"
dependencies = [
    "paddlepaddle==3.2.1",
    "paddleocr>=3.7",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
samples = ["reportlab>=4.0"]
