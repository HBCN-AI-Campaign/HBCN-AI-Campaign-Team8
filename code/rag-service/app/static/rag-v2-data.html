<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V2 数据可视化风 - RAG 知识库管理</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      overflow-x: hidden;
    }

    /* 顶部导航 */
    .header {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-nav {
      display: flex;
      gap: 2rem;
    }
    .nav-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: color 0.2s;
      padding: 0.5rem 0;
      border-bottom: 2px solid transparent;
    }
    .nav-link:hover, .nav-link.active {
      color: #06b6d4;
      border-bottom-color: #06b6d4;
    }

    /* 主容器 */
    .container {
      padding: 2rem;
      max-width: 1600px;
      margin: 0 auto;
    }

    /* 仪表板网格 */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    /* 卡片基础样式 */
    .card {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-radius: 16px;
      padding: 1.5rem;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }
    .card:hover {
      border-color: rgba(6, 182, 212, 0.3);
      box-shadow: 0 8px 32px rgba(6, 182, 212, 0.15);
    }

    /* 统计卡片 */
    .stat-card {
      grid-column: span 3;
      text-align: center;
    }
    .stat-icon {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    .stat-value {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.25rem;
    }
    .stat-label {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-bottom: 0.5rem;
    }
    .stat-change {
      font-size: 0.75rem;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      display: inline-block;
    }
    .stat-change.up {
      background: rgba(16, 185, 129, 0.1);
      color: #10b981;
    }

    /* 图表卡片 */
    .chart-card {
      grid-column: span 6;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: #e2e8f0;
    }
    .chart-container {
      height: 300px;
    }

    /* 文档表格 */
    .table-card {
      grid-column: span 12;
    }
    .table-wrapper {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead th {
      text-align: left;
      padding: 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: #94a3b8;
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
    }
    tbody td {
      padding: 1rem;
      border-bottom: 1px solid rgba(148, 163, 184, 0.05);
    }
    tbody tr {
      transition: background 0.2s;
    }
    tbody tr:hover {
      background: rgba(6, 182, 212, 0.05);
    }
    .doc-name {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 500;
    }
    .file-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }
    .file-icon.pdf { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
    .file-icon.xlsx { background: rgba(16, 185, 129, 0.1); color: #10b981; }
    .file-icon.md { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }

    /* 状态标签 */
    .status-badge {
      padding: 0.375rem 0.75rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
    }
    .status-badge.success {
      background: rgba(16, 185, 129, 0.1);
      color: #10b981;
    }
    .status-badge.warning {
      background: rgba(251, 191, 36, 0.1);
      color: #fbbf24;
    }
    .status-badge.error {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
    }

    /* 进度条 */
    .progress-bar {
      height: 4px;
      background: rgba(148, 163, 184, 0.1);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 0.5rem;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #06b6d4, #3b82f6);
      transition: width 0.3s;
    }

    /* 操作按钮 */
    .action-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .action-btn:hover {
      background: rgba(6, 182, 212, 0.1);
      color: #06b6d4;
    }

    /* 浮动操作按钮 */
    .fab {
      position: fixed;
      right: 2rem;
      bottom: 2rem;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(6, 182, 212, 0.4);
      transition: all 0.3s;
    }
    .fab:hover {
      transform: scale(1.1) rotate(90deg);
      box-shadow: 0 12px 48px rgba(6, 182, 212, 0.6);
    }
  </style>
</head>
<body>
  <!-- 顶部导航 -->
  <div class="header">
    <div class="logo">
      <span>⚡</span>
      <span>RAG Intelligence</span>
    </div>
    <nav class="header-nav">
      <a href="#" class="nav-link active">概览</a>
      <a href="#" class="nav-link">文档库</a>
      <a href="#" class="nav-link">检索</a>
      <a href="#" class="nav-link">分析</a>
    </nav>
  </div>

  <div class="container">
    <!-- 统计仪表板 -->
    <div class="dashboard-grid">
      <div class="card stat-card">
        <div class="stat-icon">📚</div>
        <div class="stat-value">42</div>
        <div class="stat-label">总文档数</div>
        <div class="stat-change up">↑ 12%</div>
      </div>

      <div class="card stat-card">
        <div class="stat-icon">🔗</div>
        <div class="stat-value">1,285</div>
        <div class="stat-label">索引片段</div>
        <div class="stat-change up">↑ 5.3%</div>
      </div>

      <div class="card stat-card">
        <div class="stat-icon">🎯</div>
        <div class="stat-value">96.2%</div>
        <div class="stat-label">检索准确率</div>
        <div class="stat-change up">↑ 2.1%</div>
      </div>

      <div class="card stat-card">
        <div class="stat-icon">⚡</div>
        <div class="stat-value">0.3s</div>
        <div class="stat-label">平均响应</div>
        <div class="stat-change up">优秀</div>
      </div>

      <!-- 知识分布图表 -->
      <div class="card chart-card">
        <div class="card-header">
          <h3 class="card-title">知识范围分布</h3>
        </div>
        <div class="chart-container" id="scopeChart"></div>
      </div>

      <!-- 准确率趋势图表 -->
      <div class="card chart-card">
        <div class="card-header">
          <h3 class="card-title">检索准确率趋势</h3>
        </div>
        <div class="chart-container" id="accuracyChart"></div>
      </div>

      <!-- 文档列表 -->
      <div class="card table-card">
        <div class="card-header">
          <h3 class="card-title">最近文档</h3>
          <button class="action-btn">查看全部 →</button>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>文档名称</th>
                <th>知识范围</th>
                <th>片段数</th>
                <th>状态</th>
                <th>更新时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>
                  <div class="doc-name">
                    <div class="file-icon pdf">📄</div>
                    <span>贷款审核规则v2.3.pdf</span>
                  </div>
                </td>
                <td><span style="color: #06b6d4;">业务规则</span></td>
                <td>42</td>
                <td><span class="status-badge success">● 可检索</span></td>
                <td style="color: #94a3b8;">2024-10-19 14:30</td>
                <td>
                  <button class="action-btn">⋮</button>
                </td>
              </tr>
              <tr>
                <td>
                  <div class="doc-name">
                    <div class="file-icon xlsx">📊</div>
                    <span>项目需求书v1.2.xlsx</span>
                  </div>
                </td>
                <td><span style="color: #8b5cf6;">项目设计</span></td>
                <td>28</td>
                <td>
                  <span class="status-badge warning">● 处理中</span>
                  <div class="progress-bar">
                    <div class="progress-fill" style="width: 85%"></div>
                  </div>
                </td>
                <td style="color: #94a3b8;">2024-10-19 15:05</td>
                <td>
                  <button class="action-btn">⋮</button>
                </td>
              </tr>
              <tr>
                <td>
                  <div class="doc-name">
                    <div class="file-icon md">📝</div>
                    <span>技术方案.md</span>
                  </div>
                </td>
                <td><span style="color: #8b5cf6;">项目设计</span></td>
                <td>15</td>
                <td><span class="status-badge error">● 解析失败</span></td>
                <td style="color: #94a3b8;">2024-10-18 10:12</td>
                <td>
                  <button class="action-btn">⋮</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- 浮动操作按钮 -->
  <button class="fab">+</button>

  <script>
    // 知识分布饼图
    const scopeChart = echarts.init(document.getElementById('scopeChart'));
    scopeChart.setOption({
      backgroundColor: 'transparent',
      tooltip: { trigger: 'item' },
      legend: {
        top: '5%',
        left: 'center',
        textStyle: { color: '#94a3b8' }
      },
      series: [{
        type: 'pie',
        radius: ['40%', '70%'],
        avoidLabelOverlap: false,
        itemStyle: {
          borderRadius: 10,
          borderColor: '#0f172a',
          borderWidth: 2
        },
        label: { show: false },
        emphasis: {
          label: {
            show: true,
            fontSize: 20,
            fontWeight: 'bold',
            color: '#e2e8f0'
          }
        },
        data: [
          { value: 29, name: '业务规则', itemStyle: { color: '#06b6d4' } },
          { value: 13, name: '项目设计', itemStyle: { color: '#8b5cf6' } }
        ]
      }]
    });

    // 准确率趋势图
    const accuracyChart = echarts.init(document.getElementById('accuracyChart'));
    accuracyChart.setOption({
      backgroundColor: 'transparent',
      tooltip: { trigger: 'axis' },
      xAxis: {
        type: 'category',
        data: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
        axisLine: { lineStyle: { color: '#334155' } },
        axisLabel: { color: '#94a3b8' }
      },
      yAxis: {
        type: 'value',
        min: 90,
        max: 100,
        axisLine: { show: false },
        axisLabel: { color: '#94a3b8', formatter: '{value}%' },
        splitLine: { lineStyle: { color: '#1e293b' } }
      },
      series: [{
        data: [94.1, 95.2, 94.8, 96.2, 95.5, 96.8, 96.2],
        type: 'line',
        smooth: true,
        lineStyle: {
          color: '#06b6d4',
          width: 3
        },
        areaStyle: {
          color: {
            type: 'linear',
            x: 0, y: 0, x2: 0, y2: 1,
            colorStops: [
              { offset: 0, color: 'rgba(6, 182, 212, 0.3)' },
              { offset: 1, color: 'rgba(6, 182, 212, 0)' }
            ]
          }
        }
      }]
    });

    // 响应式
    window.addEventListener('resize', () => {
      scopeChart.resize();
      accuracyChart.resize();
    });

    // FAB 点击
    document.querySelector('.fab').addEventListener('click', () => {
      alert('上传文档');
    });
  </script>
</body>
</html>
