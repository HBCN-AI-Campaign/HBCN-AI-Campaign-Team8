<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1395" viewBox="0 0 1600 1395" role="img" aria-label="资料入库｜OCR为什么被拦，批准后走到哪里">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526984"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif;fill:#17304e} .title{font-size:36px;font-weight:700} .subtitle{font-size:20px;fill:#526984} .head{font-size:24px;font-weight:700} .body{font-size:21px} .small{font-size:18px;fill:#526984} .label{font-size:19px;font-weight:600}</style>
<rect width="1600" height="1395" fill="#f5f8fc"/>
<text x="50" y="66" class="title">资料入库｜OCR为什么被拦，批准后走到哪里</text>
<text x="50" y="105" class="subtitle">当前真实流程：质量门禁在Embedding前。橙色是规则，红色是尚未完成的用户操作流程。</text>
<rect x="50" y="138" width="18" height="18" rx="4" fill="#67b78b"/>
<text x="79" y="154" class="small">绿色：已有真实成功链路</text>
<rect x="480" y="138" width="18" height="18" rx="4" fill="#e3b54e"/>
<text x="509" y="154" class="small">橙色：条件 / 拦截 / 实测限制</text>
<rect x="1010" y="138" width="18" height="18" rx="4" fill="#d96b62"/>
<text x="1039" y="154" class="small">红色：阻断 / 用户流程未闭环</text>
<rect x="50" y="200" width="430" height="115" rx="16" fill="#fff" stroke="#c4d4e5" stroke-width="2"/>
<text x="72" y="235" class="head">1　接收文件、保留原件</text>
<text x="72" y="265" class="body">检查格式/大小/范围</text>
<text x="72" y="292" class="body">登记原件SHA256；生成文档ID</text>
<rect x="560" y="200" width="480" height="115" rx="16" fill="#fff" stroke="#c4d4e5" stroke-width="2"/>
<text x="582" y="235" class="head">2　提取可处理的文字</text>
<text x="582" y="265" class="body">原生提取 或 OCR/视觉识别</text>
<text x="582" y="292" class="body">你的PDF：3页 vision_ocr，已有文字</text>
<rect x="1120" y="200" width="430" height="115" rx="16" fill="#fff" stroke="#c4d4e5" stroke-width="2"/>
<text x="1142" y="235" class="head">3　自动检查解析结果</text>
<text x="1142" y="265" class="body">字符、空页、字形、提取方法</text>
<text x="1142" y="292" class="body">检查内容及报告绑定版本</text>
<path d="M 480 258 L 560 258" fill="none" stroke="#526984" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 1040 258 L 1120 258" fill="none" stroke="#526984" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="50" y="430" width="430" height="125" rx="16" fill="#ecfaf3" stroke="#67b78b" stroke-width="2"/>
<text x="72" y="465" class="head">A　mechanically_checked</text>
<text x="72" y="495" class="body">基础检查通过</text>
<text x="72" y="522" class="body">不声称已证明全文完整/内容正确</text>
<rect x="560" y="430" width="480" height="155" rx="16" fill="#fff8e8" stroke="#e3b54e" stroke-width="2"/>
<text x="582" y="465" class="head">B　quality_review【你的文件】</text>
<text x="582" y="495" class="body">当前：只要经过OCR就要求复核</text>
<text x="582" y="522" class="body">没有发现非法字符；并非已发现错字</text>
<text x="582" y="549" class="body">待核对原件，暂不Embedding/不检索</text>
<rect x="1120" y="430" width="430" height="125" rx="16" fill="#fff0ef" stroke="#d96b62" stroke-width="2"/>
<text x="1142" y="465" class="head">C　quarantined</text>
<text x="1142" y="495" class="body">无可用正文、非法/损坏文字</text>
<text x="1142" y="522" class="body">不Embedding；不能直接批准绕过</text>
<path d="M 1335 315 L 1335 365 L 265 365 L 265 430" fill="none" stroke="#526984" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 800 365 L 800 430" fill="none" stroke="#526984" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 1335 365 L 1335 430" fill="none" stroke="#526984" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="86" y="402" class="label">基础检查通过</text>
<text x="610" y="402" class="label">OCR / 结构等不确定</text>
<text x="1185" y="402" class="label">检测到硬性问题</text>
<rect x="50" y="675" width="430" height="140" rx="16" fill="#ecfaf3" stroke="#67b78b" stroke-width="2"/>
<text x="72" y="710" class="head">4　切分 → Embedding</text>
<text x="72" y="740" class="body">输入：提取后的文字片段</text>
<text x="72" y="767" class="body">向量模型不会校正原文/OCR错误</text>
<text x="72" y="794" class="body">保存片段、向量与原文位置</text>
<path d="M 265 555 L 265 675" fill="none" stroke="#526984" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="560" y="675" width="480" height="180" rx="16" fill="#fff0ef" stroke="#d96b62" stroke-width="2"/>
<text x="582" y="710" class="head">当前断点：用户无法在页面批准</text>
<text x="582" y="740" class="body">后台有读取质量/提交批准的接口</text>
<text x="582" y="767" class="body">页面缺原件与文字对照、批准按钮</text>
<text x="582" y="794" class="body">审核身份注册表当前也未配置</text>
<text x="582" y="821" class="body">不能用“刷新”或“撤回”完成批准</text>
<path d="M 800 585 L 800 675" fill="none" stroke="#526984" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1120" y="675" width="430" height="145" rx="16" fill="#fff" stroke="#c4d4e5" stroke-width="2"/>
<text x="1142" y="710" class="head">拒绝 / 更正后重试</text>
<text x="1142" y="740" class="body">reject → failed / quality_rejected</text>
<text x="1142" y="767" class="body">重新解析或提供更清晰原件</text>
<text x="1142" y="794" class="body">不能把损坏内容直接标为合格</text>
<path d="M 1040 745 L 1120 745" fill="none" stroke="#526984" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1051" y="730" class="label">拒绝</text>
<rect x="560" y="930" width="480" height="150" rx="16" fill="#fff" stroke="#c4d4e5" stroke-width="2"/>
<text x="582" y="965" class="head">获授权核对并批准后【后台已有】</text>
<text x="582" y="995" class="body">记录操作者、版本摘要、已核对页</text>
<text x="582" y="1022" class="body">approve → queued → 复用已核对正文</text>
<text x="582" y="1049" class="body">不再次OCR改变文字 → 继续Embedding</text>
<path d="M 800 855 L 800 930" fill="none" stroke="#526984" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="822" y="900" class="label">逐页对照完成后才可提交</text>
<path d="M 560 1005 L 515 1005 L 515 745 L 480 745" fill="none" stroke="#526984" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="50" y="900" width="430" height="130" rx="16" fill="#ecfaf3" stroke="#67b78b" stroke-width="2"/>
<text x="72" y="935" class="head">5　ready：可以检索</text>
<text x="72" y="965" class="body">事务发布可检索片段</text>
<text x="72" y="992" class="body">你的文件目前尚未到此状态</text>
<text x="72" y="1018" class="small">ready ≠ 法规现行有效或本案适用</text>
<path d="M 265 815 L 265 900" fill="none" stroke="#526984" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1120" y="930" width="430" height="150" rx="16" fill="#fff8e8" stroke="#e3b54e" stroke-width="2"/>
<text x="1142" y="965" class="head">为什么拦这一道？</text>
<text x="1142" y="995" class="body">例：5000误识别为500；漏了“不”</text>
<text x="1142" y="1022" class="body">Embedding会编码错误文字</text>
<text x="1142" y="1049" class="body">并不能发现/修复数字、否定或漏页</text>
<rect x="50" y="1160" width="1500" height="160" rx="16" fill="#f3f0ff" stroke="#a395c5" stroke-width="2" stroke-dasharray="8 5"/>
<text x="72" y="1195" class="head">需要补的功能【建议，尚未实施】</text>
<text x="72" y="1225" class="body">① 页面显示具体原因、原件/文字对照、重新识别、批准继续；审核权限由后台校验，不将服务密钥发给浏览器。</text>
<text x="72" y="1252" class="body">② 质量分级：有可验证自动校验依据再自动放行，将确有疑点的OCR/表格/金额/缺页交人工处理。</text>
<text x="72" y="1279" class="body">③ 本次仅记录设计与缺口，未改变门禁；“先向量化未核验资料、隔离参考”仍需另行评审实现。</text>
</svg>