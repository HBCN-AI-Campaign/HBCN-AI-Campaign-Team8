<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1475" viewBox="0 0 1600 1475" role="img" aria-label="RAG 独立模块｜当前架构展开">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526984"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif;fill:#17304e} .title{font-size:36px;font-weight:700} .subtitle{font-size:20px;fill:#526984} .head{font-size:24px;font-weight:700} .body{font-size:21px} .small{font-size:18px;fill:#526984} .label{font-size:19px;font-weight:600}</style>
<rect width="1600" height="1475" fill="#f5f8fc"/>
<text x="50" y="66" class="title">RAG 独立模块｜当前架构展开</text>
<text x="50" y="105" class="subtitle">2026-10-22 · 按当前源码与实测绘制；可选适配器存在，不等于已启用或通过业务验收。</text>
<rect x="50" y="138" width="18" height="18" rx="4" fill="#67b78b"/>
<text x="79" y="154" class="small">绿色：已有真实成功链路</text>
<rect x="480" y="138" width="18" height="18" rx="4" fill="#e3b54e"/>
<text x="509" y="154" class="small">橙色：条件 / 拦截 / 实测限制</text>
<rect x="1010" y="138" width="18" height="18" rx="4" fill="#d96b62"/>
<text x="1039" y="154" class="small">红色：阻断 / 用户流程未闭环</text>
<rect x="50" y="190" width="700" height="50" rx="16" fill="#edf4ff" stroke="#87aee2" stroke-width="2"/>
<text x="72" y="225" class="head">A　资料入库：原件 → 可检索知识</text>
<rect x="850" y="190" width="700" height="50" rx="16" fill="#edf4ff" stroke="#87aee2" stroke-width="2"/>
<text x="872" y="225" class="head">B　Agentic 检索：问题 → 原文证据 / 参考答复</text>
<rect x="50" y="270" width="700" height="105" rx="16" fill="#fff" stroke="#c4d4e5" stroke-width="2"/>
<text x="72" y="305" class="head">1　上传入口与服务鉴权</text>
<text x="72" y="335" class="body">React 工作台 / 可信后端 → POST /ingestions</text>
<text x="72" y="362" class="body">检查格式、大小、共享范围；保存原件、SHA256与状态</text>
<rect x="50" y="425" width="700" height="130" rx="16" fill="#fff" stroke="#c4d4e5" stroke-width="2"/>
<text x="72" y="460" class="head">2　内容提取与 OCR</text>
<text x="72" y="490" class="body">PDF有文字：原生提取；无文字：逐页渲染后OCR</text>
<text x="72" y="517" class="body">OCR服务优先，图片可走百炼视觉兜底；记录页码/方法</text>
<text x="72" y="543" class="small">parsing.py · ocr.py</text>
<rect x="50" y="605" width="700" height="140" rx="16" fill="#fff8e8" stroke="#e3b54e" stroke-width="2"/>
<text x="72" y="640" class="head">3　解析质量门禁【你本次停在这里】</text>
<text x="72" y="670" class="body">无效正文 → quarantined；OCR等不确定 → quality_review</text>
<text x="72" y="697" class="body">人工复核后台接口已有；批准页面与审核身份未配好</text>
<text x="72" y="733" class="small">document_quality.py · 详见第二张图；此处在Embedding之前</text>
<rect x="50" y="800" width="700" height="115" rx="16" fill="#ecfaf3" stroke="#67b78b" stroke-width="2"/>
<text x="72" y="835" class="head">4　切分、Embedding、发布索引</text>
<text x="72" y="865" class="body">切分保留原文位置 → 百炼Embedding → pgvector</text>
<text x="72" y="892" class="body">完成事务后才标记 ready；当前为1024维向量</text>
<rect x="50" y="970" width="700" height="120" rx="16" fill="#ecfaf3" stroke="#67b78b" stroke-width="2"/>
<text x="72" y="1005" class="head">5　持久化知识与原文读取</text>
<text x="72" y="1035" class="body">PostgreSQL：文档/正文/质量报告/事件/向量/HNSW</text>
<text x="72" y="1062" class="body">原件目录独立保存；reader定位、source读取原件</text>
<rect x="50" y="1150" width="700" height="135" rx="16" fill="#fff" stroke="#c4d4e5" stroke-width="2"/>
<text x="72" y="1185" class="head">6　生命周期与运行边界</text>
<text x="72" y="1215" class="body">撤回：停止检索/原文拒读；返回前再检查依据状态</text>
<text x="72" y="1242" class="body">请求取消、总预算、单worker；主站另管用户/任务权限</text>
<text x="72" y="1273" class="small">document_store.py · request_control.py · graph_transport.py</text>
<rect x="850" y="270" width="700" height="105" rx="16" fill="#fff" stroke="#c4d4e5" stroke-width="2"/>
<text x="872" y="305" class="head">1　AI 模块 / 工作台 → HTTP 服务</text>
<text x="872" y="335" class="body">/query：单次检索；/retrievals：增强证据</text>
<text x="872" y="362" class="body">/answers 或 /answers/stream：RAG生成参考答复</text>
<rect x="850" y="425" width="700" height="130" rx="16" fill="#fff" stroke="#c4d4e5" stroke-width="2"/>
<text x="872" y="460" class="head">2　模型规划问题【模型调用①】</text>
<text x="872" y="490" class="body">意图/事实槽位 → 原问题 + 通用改写 + 中英查询</text>
<text x="872" y="517" class="body">保留原始金额/币种；会话只作背景，不作证据</text>
<text x="872" y="543" class="small">query_plan.py · 缺条件可返回 clarification</text>
<rect x="850" y="605" width="700" height="140" rx="16" fill="#fff" stroke="#c4d4e5" stroke-width="2"/>
<text x="872" y="640" class="head">3　多查询召回与候选归并</text>
<text x="872" y="670" class="body">当前：知识库向量；可选hybrid：中文FTS + 向量</text>
<text x="872" y="697" class="body">通道/查询族RRF；外部来源适配与专用rerank按配置</text>
<text x="872" y="733" class="small">postgres_engine.py · retrieval_fusion.py · rerank.py</text>
<rect x="850" y="800" width="700" height="145" rx="16" fill="#fff8e8" stroke="#e3b54e" stroke-width="2"/>
<text x="872" y="835" class="head">4　原文覆盖与法规条件【模型调用②起】</text>
<text x="872" y="865" class="body">分窗/分批核对相关性、例外、冲突与充分性</text>
<text x="872" y="892" class="body">不足可改写补查；默认最多2轮、总预算240秒</text>
<text x="872" y="919" class="body">当前有真实综合业务题 assessment_unavailable</text>
<rect x="850" y="1000" width="700" height="120" rx="16" fill="#ecfaf3" stroke="#67b78b" stroke-width="2"/>
<text x="872" y="1035" class="head">5　增强检索在此返回：原文 + 引用 + 缺口</text>
<text x="872" y="1065" class="body">/retrievals 不生成最终答复；top_k=1–8，默认5</text>
<text x="872" y="1092" class="body">充分/不足/待澄清、来源状态、停止原因交给调用方</text>
<rect x="850" y="1170" width="700" height="125" rx="16" fill="#ecfaf3" stroke="#67b78b" stroke-width="2"/>
<text x="872" y="1205" class="head">6　仅问答入口继续：生成与复核【更多模型调用】</text>
<text x="872" y="1235" class="body">严格结构/原文短引 → 逐项引用支持复核 → 最终返回</text>
<text x="872" y="1262" class="body">未通过则隐藏答复；再检查来源撤回/变化；JSON或SSE</text>
<path d="M 400 375 L 400 425" fill="none" stroke="#526984" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 400 555 L 400 605" fill="none" stroke="#526984" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 400 745 L 400 800" fill="none" stroke="#526984" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 400 915 L 400 970" fill="none" stroke="#526984" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 400 1090 L 400 1150" fill="none" stroke="#526984" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="420" y="779" class="small">机械检查通过，或本版人工复核批准</text>
<path d="M 1200 375 L 1200 425" fill="none" stroke="#526984" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 1200 555 L 1200 605" fill="none" stroke="#526984" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 1200 745 L 1200 800" fill="none" stroke="#526984" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 1200 945 L 1200 1000" fill="none" stroke="#526984" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 1200 1120 L 1200 1170" fill="none" stroke="#526984" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1220" y="1153" class="label">仅 /answers</text>
<path d="M 750 1030 L 795 1030 L 795 675 L 850 675" fill="none" stroke="#526984" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 1550 870 L 1580 870 L 1580 675 L 1550 675" fill="none" stroke="#526984" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 5"/>
<text x="855" y="971" class="small">有限补查回到召回；来源失败、预算耗尽须明确返回</text>
<rect x="50" y="1340" width="1500" height="110" rx="16" fill="#f3f0ff" stroke="#a395c5" stroke-width="2" stroke-dasharray="8 5"/>
<text x="72" y="1375" class="head">独立依赖与当前开关</text>
<text x="72" y="1405" class="body">已使用：Embedding API / 协议2模型runtime / PostgreSQL；未启用：法宝、专用reranker、网页、案例经验</text>
<text x="72" y="1432" class="body">模型规划、覆盖、生成、复核可多次调用模型，因此比单次向量检索慢；服务器RAG尚未常驻部署。</text>
</svg>