<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>慧眼助手 · React 原型 v2</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --bg:#f6f7fb; --panel:#fff; --border:#e6eaf1; --border-2:#d8dfeb;
    --ink:#18243a; --ink-2:#3f5068; --muted:#8a99b0;
    --brand:#3b6fd4; --brand-2:#24529e; --brand-soft:#edf3fd;
    --ok:#22b07d; --ok-soft:#e2f7ef; --warn:#e8a23a; --err:#d95555;
    --shadow:0 4px 16px rgba(30,50,80,.06); --shadow-lg:0 16px 44px rgba(30,50,80,.16);
    --r:10px;
  }
  * { box-sizing:border-box; }
  html,body,#root { height:100%; margin:0; }
  body { font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); font-size:14px; -webkit-font-smoothing:antialiased; }
  .app { height:100vh; display:grid; grid-template-columns:248px minmax(0,1fr) 272px; }

  /* 左：会话 */
  .rail { display:flex; flex-direction:column; min-height:0; background:#fafbfd; border-right:1px solid var(--border); }
  .brand { display:flex; align-items:center; gap:10px; padding:16px 16px 12px; }
  .brand .mark { width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:17px;background:linear-gradient(145deg,var(--brand),var(--brand-2)); }
  .brand .name { font-weight:700;font-size:16px;color:#16233a; }
  .brand .ver { margin-left:auto;font-size:10px;color:#b3bfd0;border:1px solid var(--border);padding:2px 7px;border-radius:20px; }
  .sec-label { padding:10px 18px 5px;font-size:11px;color:var(--muted);letter-spacing:.6px;font-weight:600; }
  .session-scroll { flex:1;overflow-y:auto;min-height:0;padding:0 10px 12px; }
  .session-item { position:relative;display:flex;align-items:center;gap:9px;padding:9px 9px;margin-bottom:2px;border-radius:9px;cursor:pointer;color:var(--ink-2);transition:.14s; }
  .session-item:hover { background:#eef2f9; }
  .session-item.active { background:var(--brand-soft);color:#1d4fa8; }
  .session-dot { width:7px;height:7px;border:2px solid #bcc8da;border-radius:50%;flex:0 0 auto; }
  .session-item.active .session-dot { border-color:var(--brand);background:var(--brand); }
  .session-main { min-width:0;flex:1; }
  .session-title { font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
  .session-meta { font-size:10.5px;color:#a3b0c2;margin-top:2px; }
  .session-more { border:0;background:transparent;color:#a9b6c8;width:22px;height:22px;border-radius:6px;cursor:pointer;font-size:14px;display:none;place-items:center; }
  .session-item:hover .session-more { display:grid; }
  .session-more:hover { background:#e2e9f4;color:var(--ink-2); }
  .empty { padding:16px 10px;color:#9aa9be;font-size:12px;text-align:center; }
  .rail-foot { padding:12px 16px;border-top:1px solid var(--border);color:#6d7f99;font-size:11px;display:flex;align-items:center;gap:7px; }
  .live-dot { width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft); }

  /* 下拉菜单 */
  .menu { position:absolute;right:8px;top:34px;z-index:20;background:#fff;border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow-lg);padding:4px;min-width:120px; }
  .menu button { display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:7px 10px;font-size:12.5px;color:var(--ink-2);border-radius:6px;cursor:pointer;text-align:left; }
  .menu button:hover { background:#f2f5fa; }
  .menu button.danger { color:var(--err); }
  .menu button.danger:hover { background:#fdf0f0; }

  /* 中：对话 */
  .chat { min-width:0;min-height:0;display:flex;flex-direction:column;background:#fff; }
  .chat-head { display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 22px;border-bottom:1px solid var(--border); }
  .chat-head h2 { margin:0;font-size:15.5px;color:#152642;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
  .chat-head .sub { font-size:11px;color:var(--muted);margin-top:2px; }
  .head-actions { display:flex;gap:8px; }
  .btn { border:1px solid var(--border-2);background:#fff;color:var(--ink-2);border-radius:8px;padding:7px 13px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.14s; }
  .btn:hover { border-color:#b9cdec;color:var(--brand);background:#fafcff; }
  .btn.primary { background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600; }
  .btn.primary:hover { background:var(--brand-2); }
  .btn.ghost { border-color:transparent;background:transparent; }
  .btn.ghost:hover { background:var(--brand-soft); }

  .msg-list { flex:1;overflow-y:auto;min-height:0;padding:22px clamp(20px,4vw,66px) 14px; }
  .welcome { max-width:680px;margin:4vh auto 0;text-align:center; }
  .welcome .mark { width:54px;height:54px;margin:0 auto 16px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:26px;background:linear-gradient(145deg,var(--brand),var(--brand-2)); }
  .welcome h3 { margin:0 0 8px;font-size:23px;color:#172c4f; }
  .welcome p { margin:0 auto 24px;max-width:480px;color:#8493a9;font-size:13px;line-height:1.7; }
  .prompt-grid { display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:left; }
  .prompt-card { padding:13px 12px;border:1px solid #e6ebf3;border-radius:10px;background:#fff;cursor:pointer;transition:.16s; }
  .prompt-card:hover { border-color:#a8c4ed;box-shadow:var(--shadow);transform:translateY(-2px); }
  .prompt-card b { display:block;font-size:12.5px;color:#33496a;margin-bottom:5px; }
  .prompt-card span { font-size:11px;color:#8c9bb0;line-height:1.5; }

  .row { display:flex;align-items:flex-start;gap:11px;max-width:800px;margin-bottom:22px; }
  .row.assistant { margin-right:auto; }
  .row.user { flex-direction:row-reverse;margin-left:auto; }
  .avatar { width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:15px;font-weight:700;flex:0 0 auto; }
  .avatar.assistant { background:#e9f1ff;color:var(--brand); }
  .avatar.user { background:#e8edf4;color:#5d718b; }
  .body { max-width:calc(100% - 44px);min-width:0; }
  .meta { display:flex;align-items:center;gap:8px;margin:1px 2px 6px; }
  .row.user .meta { justify-content:flex-end; }
  .meta b { font-size:11px;color:#6d829d; }
  .stream-badge { font-size:11px;color:var(--brand);display:inline-flex;align-items:center;gap:5px; }
  .msg-actions { display:flex;gap:2px;margin-left:auto; }
  .row.user .msg-actions { display:none; }
  .mini-btn { border:0;background:none;color:#9aa9be;font-size:10.5px;cursor:pointer;padding:2px 6px;border-radius:5px; }
  .mini-btn:hover { background:#eef2f8;color:var(--brand); }
  .card { padding:13px 15px;border:1px solid #e4e9f1;border-radius:5px 11px 11px 11px;background:#fff;box-shadow:var(--shadow);font-size:14px;line-height:1.75;color:var(--ink-2); }
  .row.user .card { border:0;border-radius:11px 5px 11px 11px;background:#eaf1fb;color:#2f558d;box-shadow:none;white-space:pre-wrap;overflow-wrap:anywhere; }
  .card p { margin:0 0 9px; }
  .card p:last-child { margin-bottom:0; }
  .card h4 { margin:14px 0 6px;font-size:13.5px;color:#253a5c; }
  .card table { width:100%;border-collapse:collapse;margin:10px 0;font-size:13px; }
  .card th,.card td { padding:7px 10px;border:1px solid #e4e9f1;text-align:left; }
  .card th { background:#f2f6fb;font-weight:600;color:#33496a; }
  .card code { background:#f1f4f9;padding:1px 5px;border-radius:4px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;color:#33496a; }
  .card pre { background:#f7f9fc;border:1px solid #e6ebf3;border-radius:8px;padding:10px 12px;overflow:auto;font-size:12.5px;line-height:1.6; }
  .card a { color:var(--brand); }
  .disclaimer { margin-top:10px;padding-top:9px;border-top:1px dashed #e2e8f0;font-size:11.5px;color:#9aa9be; }
  .cursor::after { content:"▍";color:var(--brand);animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }

  /* 活动流 */
  .activity { margin-bottom:12px;border:1px solid #e3ebf5;border-radius:10px;background:#f9fbfe;overflow:hidden; }
  .activity.running { border-color:#c9daf4;background:#f8faff; }
  .act-head { display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border:0;background:none;cursor:pointer;color:#344761;text-align:left; }
  .act-spark { width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:#e8f0fc;color:#4875bd;flex:0 0 auto;font-size:12px; }
  .act-copy { flex:1;min-width:0; }
  .act-copy b { display:block;font-size:12px; }
  .act-copy small { display:block;color:#8a99b0;font-size:11px; }
  .act-chev { color:#9aa9be;transition:.2s; }
  .act-chev.open { transform:rotate(90deg); }
  .act-feed { padding:2px 12px 10px; }
  .act-item { display:flex;align-items:flex-start;gap:10px;padding:6px 0; }
  .act-rail { display:flex;flex-direction:column;align-items:center;width:16px;flex:0 0 auto; }
  .act-dot { width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:9px;margin-top:2px; }
  .act-dot.done { background:var(--ok);color:#fff; }
  .act-dot.running { background:var(--brand);box-shadow:0 0 0 4px #dfe9fb;animation:pulse 1.2s ease-in-out infinite; }
  .act-dot.pending { background:#dfe6ef;border:2px solid #cdd7e4; }
  .act-dot.fail { background:var(--err);color:#fff; }
  .act-line { width:2px;flex:1;min-height:8px;background:#e3ebf4;margin:2px 0; }
  .act-item:last-child .act-line { display:none; }
  .act-copy2 b { display:block;font-size:12px;color:#3b5270; }
  .act-copy2 b.running { color:var(--brand); }
  .act-copy2 small { color:#8a99b0;font-size:11px; }
  @keyframes pulse { 0%,100% { opacity:.55;transform:scale(.9);} 50% { opacity:1;transform:scale(1.08);} }
  .spin { width:13px;height:13px;border:2px solid #c7d6ef;border-top-color:var(--brand);border-radius:50%;animation:rot .8s linear infinite; }
  @keyframes rot { to { transform:rotate(360deg);} }

  /* 建议追问 */
  .suggestions { display:flex;flex-wrap:wrap;gap:7px;margin-top:11px; }
  .sug-pill { border:1px solid #e2e8f1;background:#fff;color:#45608a;border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer;transition:.14s; }
  .sug-pill:hover { border-color:#a8c4ed;background:var(--brand-soft);color:var(--brand); }

  /* 引用 */
  .citations { margin-top:11px; }
  .cite-label { font-size:11px;color:#8a99b0;margin-bottom:6px; }
  .cite-chip { display:inline-flex;align-items:center;gap:6px;margin:0 6px 6px 0;padding:4px 10px;border:1px solid #e2e8f0;border-radius:14px;font-size:11px;color:#526681;background:#fbfcfe; }
  .cite-chip .dot { width:6px;height:6px;border-radius:50%; }
  .cite-chip .dot.file { background:var(--brand); }
  .cite-chip .dot.rule { background:var(--warn); }
  .cite-chip .dot.kb { background:var(--ok); }

  /* 输入区 */
  .composer { flex:0 0 auto;padding:10px 22px 13px;border-top:1px solid var(--border);background:#fff; }
  .composer-box { display:flex;align-items:flex-end;gap:8px;border:1px solid #d9e2ee;border-radius:13px;padding:8px 8px 8px 14px;background:#fff;transition:.15s; }
  .composer-box:focus-within { border-color:#a8c4ed;box-shadow:0 0 0 3px #edf4ff; }
  .composer-box textarea { flex:1;border:0;outline:0;resize:none;font-size:14px;line-height:1.6;color:var(--ink);font-family:inherit;background:none;max-height:140px; }
  .icon-btn { border:0;background:#eef3fb;color:var(--brand);width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:15px;flex:0 0 auto;display:grid;place-items:center; }
  .icon-btn:hover { background:#e1ebfb; }
  .send { background:var(--brand);color:#fff; }
  .send:hover { background:var(--brand-2); }
  .send:disabled { background:#c6d3e8;cursor:not-allowed; }
  .send.stop { background:#202837; }
  .composer-foot { padding:7px 4px 0;font-size:11px;color:#9aa9be;text-align:center; }

  /* 右：技能商店 */
  .skills { display:flex;flex-direction:column;min-height:0;background:#fafbfd;border-left:1px solid var(--border); }
  .skills-head { display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px; }
  .skills-head b { font-size:14px;color:#16233a; }
  .skills-head span { font-size:11px;color:#9aa9be; }
  .skill-search { margin:0 14px 6px;position:relative; }
  .skill-search input { width:100%;border:1px solid #e0e6ef;border-radius:9px;padding:8px 10px 8px 30px;font-size:12.5px;outline:0;background:#fff;color:var(--ink); }
  .skill-search input:focus { border-color:#a8c4ed; }
  .skill-search .mag { position:absolute;left:9px;top:8px;color:#9aa9be; }
  .skill-scroll { flex:1;overflow-y:auto;min-height:0;padding:2px 12px 12px; }
  .skill-cat { padding:12px 8px 5px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.4px; }
  .skill-item { width:100%;display:flex;align-items:flex-start;gap:10px;padding:10px 9px;margin-bottom:4px;border:1px solid transparent;border-radius:10px;background:none;cursor:pointer;text-align:left;transition:.14s; }
  .skill-item:hover { background:#fff;border-color:#e3ebf4;box-shadow:var(--shadow); }
  .skill-icon { width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:15px;background:#edf4ff;flex:0 0 auto; }
  .skill-copy { min-width:0; }
  .skill-copy b { display:block;font-size:12.5px;color:#33496a; }
  .skill-copy b .custom { font-size:10px;color:var(--brand);background:var(--brand-soft);border-radius:4px;padding:1px 5px;margin-left:5px;font-weight:600; }
  .skill-copy small { display:block;color:#8c9bb0;font-size:11px;line-height:1.45;margin-top:3px; }
  .create-skill { width:calc(100% - 0px);margin-top:8px;justify-content:center; }
  .skills-foot { padding:11px 16px;border-top:1px solid var(--border);font-size:11px;color:#8a99b0; }

  /* 弹层 */
  .overlay { position:fixed;inset:0;background:rgba(20,34,55,.4);display:grid;place-items:center;z-index:50; }
  .modal { width:min(500px,92vw);background:#fff;border-radius:13px;padding:20px;box-shadow:var(--shadow-lg); }
  .modal h3 { margin:0 0 14px;font-size:15px;color:#172a4b; }
  .modal label { display:block;font-size:12px;color:#6d829d;margin:12px 0 5px; }
  .modal input,.modal textarea,.modal select { width:100%;border:1px solid #d9e2ee;border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit;color:var(--ink);outline:0;background:#fff; }
  .modal input:focus,.modal textarea:focus,.modal select:focus { border-color:#a8c4ed; }
  .modal-actions { display:flex;justify-content:flex-end;gap:8px;margin-top:18px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

/* ============ 数据 ============ */
const SKILL_CATEGORIES = ["单证核对", "合规风控", "外汇与日历", "法规检索"];
const PRESET_SKILLS = [
  { id:"billoflading", icon:"🚢", name:"提单验真", desc:"核对提单与交易单据的一致性", prompt:"请核对提单与交易单据的一致性，重点检查发货人、收货人、装运港、数量与日期。", category:"单证核对" },
  { id:"invoicecontract", icon:"🧾", name:"发票-合同一致性", desc:"比对发票金额、币种、贸易术语与合同", prompt:"请比对发票与合同的金额、币种、贸易术语是否一致，列出差异点。", category:"单证核对" },
  { id:"drawdown", icon:"📄", name:"提款材料完整性核对", desc:"对照提款指示逐项核对单据是否齐备", prompt:"请对照提款指示逐项核对当前任务的单据是否齐备，列出缺失项与待补材料。", category:"单证核对" },
  { id:"docreconcile", icon:"🔍", name:"单据字段交叉比对", desc:"比对材料字段并列出不一致项", prompt:"请交叉比对各单据字段，列出不一致项并定位原文位置。", category:"单证核对" },
  { id:"sanctions", icon:"🛡️", name:"制裁名单/反洗钱筛查", desc:"整理主体信息与筛查待核验项", prompt:"请整理任务涉及的主体信息，列出制裁名单与反洗钱筛查的待核验项。", category:"合规风控" },
  { id:"proceeds", icon:"🎯", name:"资金用途合规审核", desc:"核对资金用途与合同/监管要求", prompt:"请核对资金用途与合同及监管要求的一致性，标注需人工确认的合规要点。", category:"合规风控" },
  { id:"tradebg", icon:"🌐", name:"贸易背景真实性核查", desc:"结合合同、发票、提单核对贸易背景", prompt:"请结合合同、发票、提单核对贸易背景真实性，识别逻辑矛盾与缺失证据。", category:"合规风控" },
  { id:"duplicate", icon:"🔁", name:"重复融资排查", desc:"交叉比对主体与单据识别重复融资", prompt:"请交叉比对主体与单据信息，识别重复融资风险并列出可疑线索。", category:"合规风控" },
  { id:"fx", icon:"💱", name:"汇率与币种换算", desc:"核对币种、金额及换算依据", prompt:"请核对任务涉及的币种与金额，识别是否需要外部汇率依据以及材料中的换算差异。", category:"外汇与日历" },
  { id:"busday", icon:"📅", name:"节假日/工作日核验", desc:"定位业务日期与工作日历风险", prompt:"请定位业务日期，结合工作日历识别节假日导致的起息日/到期日风险。", category:"外汇与日历" },
  { id:"regulatory", icon:"📚", name:"法规/监管合规检索", desc:"检索知识库规则并整理适用性", prompt:"请检索知识库中的法规与规则，整理与当前任务相关的适用条款及依据。", category:"法规检索" },
  { id:"guarantee", icon:"🔐", name:"担保/抵押文件审核", desc:"核对担保文件的完整性与有效性", prompt:"请核对担保/抵押文件的完整性与有效性，列出需人工确认的条款。", category:"法规检索" },
];

const ANSWER_TEMPLATES = [
  (q) => `针对「${q}」，我按以下思路整理审核辅助意见：

**当前情况**
- 已读取本轮授权证据，结合任务材料与规则结果核对；
- 证据缺失或冲突的项会明确标注为待人工确认。

**建议的人工核验点**
| 核对项 | 现状 | 建议 |
| --- | --- | --- |
| 单据完整性 | 待确认 | 对照提款指示逐项比对 |
| 金额/币种 | 待确认 | 比对合同与发票 |
| 贸易背景 | 待确认 | 结合提单交叉验证 |

我会持续解释证据、整理风险并起草复核意见，但不作出批准或拒绝决定。`,
];
const DISCLAIMER = "以上为审核辅助意见，不是贷款最终审批决定，请由有权限的审核人员复核。";
const SUGGESTIONS = ["列出缺件清单", "整理风险摘要", "起草人工复核意见"];

let _id = 0;
const uid = () => `m${Date.now()}-${++_id}`;
const relTime = (ts) => { const d = Date.now()-ts; if(d<60000)return"刚刚"; if(d<3600000)return Math.floor(d/60000)+" 分钟前"; if(d<86400000)return Math.floor(d/3600000)+" 小时前"; return Math.floor(d/86400000)+" 天前"; };

function genSteps(skillName) {
  const s = [];
  if (skillName) s.push({ key:"skill", label:`应用技能：${skillName}`, detail:"载入已审核的业务指引", status:"pending" });
  s.push({ key:"retrieve", label:"检索授权证据", detail:"查询任务材料、规则结果与知识库", status:"pending" });
  s.push({ key:"tool", label:"读取授权证据", detail:"向模型提供本轮已授权证据", status:"pending" });
  s.push({ key:"compose", label:"生成审核建议", detail:"调用模型整合证据并起草意见", status:"pending" });
  return s;
}

function makeSession(title, minutesAgo) {
  return { id:uid(), title:title||"新会话", archived:false, updatedAt: Date.now()-(minutesAgo||0)*60000, messages:[] };
}

/* ============ 渲染组件 ============ */
function inline(s) {
  const parts = String(s).split(/(\*\*[^*]+\*\*|`[^`]+`|\[[^\]]+\]\([^)]+\))/g);
  return parts.map((p,i) => {
    if (!p) return null;
    if (p.startsWith("**") && p.endsWith("**")) return <b key={i}>{p.slice(2,-2)}</b>;
    if (p.startsWith("`") && p.endsWith("`")) return <code key={i}>{p.slice(1,-1)}</code>;
    const m = p.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
    if (m) return <a key={i} href={m[2]} target="_blank" rel="noreferrer">{m[1]}</a>;
    return p;
  });
}

function Markdown({ text }) {
  const lines = text.split("\n");
  const out = [];
  let table = []; let code = [];
  const flushTable = () => { if (table.length) { const [h,...b] = table; out.push(<table key={uid()}><thead><tr>{h.map((c,j)=><th key={j}>{inline(c)}</th>)}</tr></thead><tbody>{b.map((r,ri)=><tr key={ri}>{r.map((c,ci)=><td key={ci}>{inline(c)}</td>)}</tr>)}</tbody></table>); table = []; } };
  const flushCode = () => { if (code.length) { out.push(<pre key={uid()}><code>{code.join("\n")}</code></pre>); code = []; } };
  for (const raw of lines) {
    const line = raw;
    const t = line.trim();
    if (t.startsWith("```")) { flushTable(); if (code.length) { flushCode(); } else { code = []; } continue; }
    if (code.length) { code.push(line); continue; }
    const isSep = /^\|[\s:\-|]+\|$/.test(t);
    const isTable = t.startsWith("|") && t.endsWith("|");
    if (isTable && !isSep) { table.push(t.replace(/^\||\|$/g,"").split("|").map(c=>c.trim())); continue; }
    if (isSep) continue;
    flushTable();
    if (t === "") continue;
    if (t.startsWith("#")) out.push(<h4 key={uid()}>{inline(t.replace(/^#+\s*/,""))}</h4>);
    else if (t.startsWith("- ")) out.push(<p key={uid()}>• {inline(t.slice(2))}</p>);
    else out.push(<p key={uid()}>{inline(t)}</p>);
  }
  flushTable(); flushCode();
  return <div>{out}</div>;
}

function Activity({ msg, expanded, onToggle }) {
  const steps = msg.steps || [];
  const running = msg.streaming;
  const doneCount = steps.filter(s=>s.status==="completed").length;
  const title = running ? "正在执行" : msg.status==="done" ? `执行记录 · ${steps.length} 步` : "执行未完成";
  const sub = running ? (steps.find(s=>s.status==="running")?.label || "准备中") : `${doneCount}/${steps.length} 完成`;
  return (
    <div className={"activity" + (running?" running":"")}>
      <button className="act-head" onClick={onToggle}>
        <span className="act-spark">{running ? <span className="spin" /> : (msg.status==="done" ? "✓" : "✕")}</span>
        <span className="act-copy"><b>{title}</b><small>{sub}</small></span>
        <span className={"act-chev"+(expanded?" open":"")}>▸</span>
      </button>
      {expanded && (
        <div className="act-feed">
          {steps.map(s => (
            <div className="act-item" key={s.key}>
              <span className="act-rail">
                <span className={"act-dot "+s.status}></span>
                <span className="act-line" />
              </span>
              <span className="act-copy2">
                <b className={s.status==="running"?"running":""}>{s.label}</b>
                {s.detail && <small>　{s.detail}</small>}
              </span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ============ 主应用 ============ */
function App() {
  const [sessions, setSessions] = useState(() => {
    const s1 = makeSession("提款材料核对", 3);
    s1.messages = [
      { id:uid(), role:"user", content:"帮我核对这笔提款单据是否齐备", status:"done", steps:[] },
      { id:uid(), role:"assistant", content:"已核对单据清单：合同、发票、提单均在场，但缺少付款指示与用途说明，需人工补齐。\n\n**下一步建议**\n- 补交付款指示\n- 补交资金用途说明\n\n"+DISCLAIMER, status:"done", steps:genSteps("提款材料完整性核对").map(s=>({...s,status:"completed"})), citations:[{id:"c1",label:"合同 · FOL-2024-018",type:"file"},{id:"c2",label:"规则 · 用途合规",type:"rule"}] },
    ];
    const s2 = makeSession("汇率风险排查", 26); s2.archived = true; s2.messages = [];
    const s3 = makeSession("制裁名单筛查", 180); s3.messages = [];
    return [s1, s2, s3];
  });
  const [activeId, setActiveId] = useState(() => null);
  const [skills, setSkills] = useState(() => { try { const c = JSON.parse(localStorage.getItem("hbcn_skills_v2")||"[]"); return [...PRESET_SKILLS, ...c]; } catch { return PRESET_SKILLS; } });
  const [skillQ, setSkillQ] = useState("");
  const [draft, setDraft] = useState("");
  const [streaming, setStreaming] = useState(false);
  const [showCreate, setShowCreate] = useState(false);
  const [expanded, setExpanded] = useState({});
  const [menuFor, setMenuFor] = useState(null);
  const listRef = useRef(null);
  const stopRef = useRef(false);
  const activeMid = useRef(null);

  useEffect(() => { if (!activeId && sessions.length) setActiveId(sessions[0].id); }, []);
  const active = useMemo(() => sessions.find(s=>s.id===activeId), [sessions, activeId]);
  const live = sessions.filter(s=>!s.archived);
  const archived = sessions.filter(s=>s.archived);

  useEffect(() => { listRef.current?.scrollTo({ top: listRef.current.scrollHeight, behavior:"smooth" }); }, [sessions, activeId]);

  const patchSession = (id,p) => setSessions(prev => prev.map(s => s.id===id ? {...s, ...p, updatedAt:Date.now()} : s));
  const patchMessage = (id,p) => setSessions(prev => prev.map(s => s.messages.some(m=>m.id===id) ? {...s, messages:s.messages.map(m=>m.id===id?{...m,...p}:m)} : s));

  const newChat = () => { const s = makeSession("", 0); setSessions(p=>[s,...p]); setActiveId(s.id); setMenuFor(null); };
  const openSession = (id) => { setActiveId(id); setMenuFor(null); };
  const toggleArchive = (id) => { patchSession(id, { archived: !sessions.find(s=>s.id===id)?.archived }); setMenuFor(null); };
  const removeSession = (id) => { setSessions(p=>p.filter(s=>s.id!==id)); if (activeId===id) { setActiveId(null); setTimeout(()=>setActiveId(sessions.filter(s=>s.id!==id)[0]?.id || null), 0); } setMenuFor(null); };

  const startStream = (mid, content, skillName) => {
    const steps = genSteps(skillName).map(s=>({...s, status:"pending"}));
    patchMessage(mid, { content:"", steps, streaming:true, status:"running", citations:[] });
    setExpanded(p=>({...p,[mid]:true}));
    setStreaming(true); stopRef.current=false; activeMid.current=mid;
    const anim = (idx) => {
      if (stopRef.current) return;
      if (idx >= steps.length) {
        patchMessage(mid, { steps: steps.map(s=>({...s, status:"completed"})) });
        typeAnswer(mid, content, skillName); return;
      }
      patchMessage(mid, { steps: steps.map((s,i)=> i<idx ? {...s,status:"completed"} : i===idx ? {...s,status:"running"} : {...s,status:"pending"}) });
      setTimeout(()=>anim(idx+1), 460 + Math.random()*360);
    };
    anim(0);
  };
  const typeAnswer = (mid, content, skillName) => {
    const answer = (skillName ? `**${skillName}**：已按该技能口径执行。\n\n` : "") + ANSWER_TEMPLATES[0](content) + "\n\n" + DISCLAIMER;
    const chars = Array.from(answer); let i = 0;
    const tick = () => {
      if (stopRef.current) { finish(mid, chars.slice(0,i).join("") + "\n\n（已停止生成）"); return; }
      i = Math.min(chars.length, i + 3 + Math.floor(Math.random()*6));
      const cur = chars.slice(0,i).join("");
      patchMessage(mid, { content: cur });
      if (i < chars.length) setTimeout(tick, 15);
      else finish(mid, answer);
    };
    setTimeout(tick, 180);
  };
  const finish = (mid, answer) => {
    setSessions(prev => prev.map(s => ({...s, messages: s.messages.map(m => m.id===mid ? {...m, content:answer, status:"done", streaming:false, steps:(m.steps||[]).map(st=>({...st, status:"completed"})), citations:[{id:uid(),label:"合同 · FOL-2024-018",type:"file"},{id:uid(),label:"规则 · 用途合规",type:"rule"}]} : m)})));
    setStreaming(false); stopRef.current=false; activeMid.current=null;
    setExpanded(p=>{ const n={...p}; delete n[mid]; return n; });
  };

  const send = (text, skill) => {
    const content = (text||"").trim();
    if (!content || streaming || !activeId) return;
    const s = sessions.find(x=>x.id===activeId);
    const userMsg = { id:uid(), role:"user", content, status:"done", steps:[] };
    const asstId = uid();
    patchSession(activeId, { messages:[...(s?.messages||[]), userMsg, { id:asstId, role:"assistant", content:"", status:"running", steps:[], streaming:true, citations:[] }], title: s?.title==="新会话" ? content.slice(0,18) : s?.title });
    setDraft("");
    startStream(asstId, content, skill?.name);
  };
  const regenerate = (mid) => {
    const s = sessions.find(x=>x.id===activeId); if (!s || streaming) return;
    const idx = s.messages.findIndex(m=>m.id===mid);
    const prev = [...s.messages.slice(0,idx)].reverse().find(m=>m.role==="user");
    if (prev) startStream(mid, prev.content, null);
  };
  const stop = () => { stopRef.current = true; };

  const addSkill = (sk) => {
    const next = [...skills, sk];
    setSkills(next);
    localStorage.setItem("hbcn_skills_v2", JSON.stringify(next.filter(s=>s.custom)));
    setShowCreate(false);
  };

  const filteredSkills = useMemo(() => skills.filter(s => !skillQ || s.name.includes(skillQ) || s.desc.includes(skillQ) || s.category.includes(skillQ)), [skills, skillQ]);
  const grouped = useMemo(() => SKILL_CATEGORIES.map(c => ({ c, items: filteredSkills.filter(s=>s.category===c) })).filter(g=>g.items.length), [filteredSkills]);

  return (
    <div className="app">
      {/* 左 */}
      <aside className="rail">
        <div className="brand"><span className="mark">慧</span><span className="name">慧眼助手</span><span className="ver">React 原型</span></div>
        <div className="sec-label">进行中</div>
        <div className="session-scroll">
          {live.length===0 && <div className="empty">暂无会话，点输入框旁「＋」新建</div>}
          {live.map(s => (
            <div key={s.id} className={"session-item"+(s.id===activeId?" active":"")} onClick={()=>openSession(s.id)}>
              <span className="session-dot" />
              <span className="session-main"><div className="session-title">{s.title}</div><div className="session-meta">{s.messages.length} 条 · {relTime(s.updatedAt)}</div></span>
              <button className="session-more" title="更多" onClick={(e)=>{e.stopPropagation();setMenuFor(menuFor===s.id?null:s.id);}}>⋯</button>
              {menuFor===s.id && (
                <div className="menu" onClick={e=>e.stopPropagation()}>
                  <button onClick={()=>toggleArchive(s.id)}>📥 存档</button>
                  <button className="danger" onClick={()=>removeSession(s.id)}>🗑 删除</button>
                </div>
              )}
            </div>
          ))}
          {archived.length>0 && <div className="sec-label">已存档</div>}
          {archived.map(s => (
            <div key={s.id} className={"session-item"+(s.id===activeId?" active":"")} onClick={()=>openSession(s.id)} style={{opacity:.72}}>
              <span className="session-dot" />
              <span className="session-main"><div className="session-title">{s.title}</div><div className="session-meta">已存档 · {s.messages.length} 条</div></span>
              <button className="session-more" title="更多" onClick={(e)=>{e.stopPropagation();setMenuFor(menuFor===s.id?null:s.id);}}>⋯</button>
              {menuFor===s.id && (
                <div className="menu" onClick={e=>e.stopPropagation()}>
                  <button onClick={()=>toggleArchive(s.id)}>↩️ 取消存档</button>
                  <button className="danger" onClick={()=>removeSession(s.id)}>🗑 删除</button>
                </div>
              )}
            </div>
          ))}
        </div>
        <div className="rail-foot"><span className="live-dot" />模型已连接 · 受控只读</div>
      </aside>

      {/* 中 */}
      <main className="chat">
        <header className="chat-head">
          <div style={{minWidth:0}}>
            <h2>{active?.title || "新会话"}</h2>
            <div className="sub">{active?.archived ? "已存档会话" : "未关联任务"}</div>
          </div>
          <div className="head-actions">
            <button className="btn ghost" onClick={newChat}>＋ 新对话</button>
            {active && (active.archived ? <button className="btn" onClick={()=>toggleArchive(active.id)}>↩️ 取消存档</button> : <button className="btn" onClick={()=>toggleArchive(active.id)}>📥 存档</button>)}
          </div>
        </header>

        <div className="msg-list" ref={listRef}>
          {(!active || active.messages.length===0) ? (
            <div className="welcome">
              <div className="mark">慧</div>
              <h3>让审核工作更快一步</h3>
              <p>我可以读取授权任务材料与规则结果，检索证据、解释规则并整理人工复核意见。</p>
              <div className="prompt-grid">
                {[{t:"梳理风险",d:"总结当前任务的风险和人工核对点"},{t:"解释规则",d:"解释不通过项，给出材料定位建议"},{t:"材料核对",d:"哪些单据字段需要优先复核？"}].map(p=>(
                  <div className="prompt-card" key={p.t} onClick={()=>send(p.d)}><b>{p.t}</b><span>{p.d}</span></div>
                ))}
              </div>
            </div>
          ) : (
            active.messages.map(m => m.role==="user" ? (
              <div className="row user" key={m.id}>
                <div className="avatar user">审</div>
                <div className="body"><div className="meta"><b>你</b></div><div className="card">{m.content}</div></div>
              </div>
            ) : (
              <div className="row assistant" key={m.id}>
                <div className="avatar assistant">慧</div>
                <div className="body">
                  <div className="meta">
                    <b>慧眼助手</b>
                    {m.streaming && <span className="stream-badge"><span className="spin" style={{width:10,height:10}} />正在生成</span>}
                    {!m.streaming && (
                      <span className="msg-actions">
                        <button className="mini-btn" onClick={()=>navigator.clipboard?.writeText(m.content)}>复制</button>
                        <button className="mini-btn" onClick={()=>regenerate(m.id)}>重新生成</button>
                      </span>
                    )}
                  </div>
                  <div className="card">
                    <Activity msg={m} expanded={!!expanded[m.id]} onToggle={()=>setExpanded(p=>({...p,[m.id]:!p[m.id]}))} />
                    <Markdown text={m.content} />
                    {m.streaming && <span className="cursor" />}
                    {m.citations?.length>0 && (
                      <div className="citations">
                        <div className="cite-label">证据引用</div>
                        {m.citations.map(c=>(
                          <span className="cite-chip" key={c.id}><span className={"dot "+(c.type||"file")} />{c.label}</span>
                        ))}
                      </div>
                    )}
                    {!m.streaming && m.status==="done" && (
                      <div className="suggestions">
                        {SUGGESTIONS.map(s=>(<button className="sug-pill" key={s} onClick={()=>send(s)}>{s}</button>))}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            ))
          )}
        </div>

        <footer className="composer">
          <div className="composer-box">
            <textarea rows="1" placeholder="描述你想核对的规则、材料或风险…" value={draft} disabled={!active}
              onChange={e=>{ setDraft(e.target.value); e.target.style.height="auto"; e.target.style.height=Math.min(e.target.scrollHeight,140)+"px"; }}
              onKeyDown={e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(draft); } }} />
            <button className="icon-btn" title="新建会话" onClick={newChat}>＋</button>
            {streaming
              ? <button className="icon-btn send stop" title="停止" onClick={stop}>■</button>
              : <button className="icon-btn send" disabled={!draft.trim()} onClick={()=>send(draft)}>➤</button>}
          </div>
          <div className="composer-foot">受控只读 · 结论由审核人员确认</div>
        </footer>
      </main>

      {/* 右：技能商店 */}
      <aside className="skills">
        <div className="skills-head"><b>审核技能</b><span>{skills.length} 项</span></div>
        <div className="skill-search"><span className="mag">🔍</span><input placeholder="搜索技能…" value={skillQ} onChange={e=>setSkillQ(e.target.value)} /></div>
        <div className="skill-scroll">
          {grouped.map(g => (
            <div key={g.c}>
              <div className="skill-cat">{g.c}</div>
              {g.items.map(s=>(
                <button className="skill-item" key={s.id} disabled={streaming} onClick={()=>send(s.prompt, s)}>
                  <span className="skill-icon">{s.icon}</span>
                  <span className="skill-copy"><b>{s.name}{s.custom && <span className="custom">自定义</span>}</b><small>{s.desc}</small></span>
                </button>
              ))}
            </div>
          ))}
          <button className="btn create-skill" onClick={()=>setShowCreate(true)}>＋ 创建技能</button>
        </div>
        <div className="skills-foot">团队内置审核指引 · 只读运行</div>
      </aside>

      {showCreate && <CreateSkillModal onClose={()=>setShowCreate(false)} onSubmit={addSkill} />}
    </div>
  );
}

function CreateSkillModal({ onClose, onSubmit }) {
  const [name,setName]=useState(""); const [desc,setDesc]=useState(""); const [prompt,setPrompt]=useState(""); const [icon,setIcon]=useState("✨"); const [category,setCategory]=useState(SKILL_CATEGORIES[0]);
  const valid = name.trim() && prompt.trim();
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h3>创建自定义技能</h3>
        <label>图标（emoji）</label><input value={icon} onChange={e=>setIcon(e.target.value)} />
        <label>技能名称</label><input placeholder="例如：担保文件审核" value={name} onChange={e=>setName(e.target.value)} />
        <label>分类</label><select value={category} onChange={e=>setCategory(e.target.value)}>{SKILL_CATEGORIES.map(c=><option key={c}>{c}</option>)}</select>
        <label>一句话说明</label><input placeholder="例如：核对担保文件的完整性与有效性" value={desc} onChange={e=>setDesc(e.target.value)} />
        <label>触发指令（发给模型的 prompt）</label><textarea rows="3" placeholder="例如：请核对担保文件与合同条款的一致性…" value={prompt} onChange={e=>setPrompt(e.target.value)} />
        <div className="modal-actions">
          <button className="btn" onClick={onClose}>取消</button>
          <button className="btn primary" disabled={!valid} onClick={()=>onSubmit({ id:uid(), icon:icon||"✨", name:name.trim(), desc:desc.trim()||name.trim(), prompt:prompt.trim(), category, custom:true })}>创建</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
