<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HBCN 知识库工作台 · Agentic RAG 原型</title>
<style>
  :root {
    --ink: #232a29;
    --muted: #6d7774;
    --line: #e3e7e6;
    --canvas: #f6f7f8;
    --surface: #fff;
    --primary: #2f5fd0;
    --primary-strong: #244daa;
    --primary-soft: #eaf0fd;
    --hit: #fff3b8;
    --teal: #0b7c68;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--ink); background: var(--canvas); overflow: hidden; }
  button { font: inherit; cursor: pointer; }
  textarea { font: inherit; }

  .app { display: flex; flex-direction: column; height: 100vh; }

  /* 顶栏 */
  .topbar {
    display: flex; align-items: center; gap: 24px; height: 58px; flex: 0 0 58px;
    padding: 0 24px; background: #fff; border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { display: grid; width: 30px; height: 30px; place-items: center; border-radius: 8px; background: var(--primary); color: #fff; font-weight: 700; }
  .brand b { display: block; font-size: 14px; line-height: 1.1; }
  .brand small { color: var(--muted); font-size: 11px; }
  .modes { display: flex; gap: 8px; margin-left: auto; }
  .mode {
    display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px;
    border: 1px solid var(--line); border-radius: 999px; background: #fff; color: #66706c; font-size: 12.5px; font-weight: 600;
    transition: all .15s ease;
  }
  .mode .dot { width: 8px; height: 8px; border-radius: 50%; background: #c2c9c6; transition: background .15s ease; }
  .mode.on { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-strong); }
  .mode.on .dot { background: var(--primary); }

  /* 工作区 */
  .workspace { display: flex; flex: 1; min-height: 0; }

  /* 中间问答区 */
  .chat { display: flex; flex-direction: column; flex: 1; min-width: 320px; }
  .chat-scroll { flex: 1; overflow-y: auto; padding: 28px 30px 12px; }
  .welcome { max-width: 620px; margin: 10vh auto 0; text-align: center; }
  .welcome .icon { display: grid; width: 50px; height: 50px; place-items: center; margin: 0 auto 16px; border-radius: 14px; background: linear-gradient(135deg, var(--primary), #5b7fe0); color: #fff; }
  .welcome h2 { margin: 0; font-size: 21px; }
  .welcome p { margin: 9px 0 24px; color: var(--muted); font-size: 13px; }
  .prompts { display: grid; gap: 9px; }
  .prompts button { display: flex; align-items: center; gap: 10px; padding: 12px 15px; border: 1px solid var(--line); border-radius: 11px; background: #fff; color: #3a4541; font-size: 13px; text-align: left; }
  .prompts button:hover { border-color: #b8c8ec; }

  .msg { display: flex; gap: 12px; max-width: 720px; margin: 0 auto 24px; }
  .msg.user { flex-direction: row-reverse; }
  .avatar { display: grid; width: 30px; height: 30px; flex: 0 0 30px; place-items: center; border-radius: 8px; font-size: 12px; font-weight: 650; }
  .avatar.ai { background: var(--primary); color: #fff; }
  .avatar.user { background: #dfe4e2; color: #4b5652; }
  .bubble-user { padding: 10px 14px; border-radius: 12px 12px 4px 12px; background: var(--primary); color: #fff; font-size: 13.5px; line-height: 1.6; }
  .msg-body { flex: 1; min-width: 0; }
  .meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; color: #4b5652; }
  .meta .tag { padding: 1px 7px; border-radius: 5px; background: #eef1f0; color: #7c8683; font-size: 10.5px; }
  .card { padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .answer { color: #333c39; font-size: 13.5px; line-height: 1.85; white-space: pre-wrap; overflow-wrap: anywhere; }
  .answer .cite { display: inline-flex; align-items: center; justify-content: center; min-width: 17px; height: 17px; margin: 0 2px; padding: 0 4px; border: 0; border-radius: 5px; background: var(--primary-soft); color: var(--primary-strong); font-size: 10.5px; font-weight: 700; vertical-align: .25em; }
  .answer .cite:hover { background: #d4e0f8; }
  .caret { display: inline-block; width: 2px; height: 1em; margin-left: 2px; background: var(--primary); vertical-align: -.15em; animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .answer-actions { display: flex; gap: 10px; margin-top: 14px; padding-top: 13px; border-top: 1px solid #eef1f0; }
  .src-btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border: 1px solid #d8e2f4; border-radius: 8px; background: #f7f9fd; color: var(--primary-strong); font-size: 12px; font-weight: 600; }
  .src-btn:hover { border-color: var(--primary); background: var(--primary-soft); }

  .composer { padding: 12px 30px 18px; }
  .composer-inner { display: flex; align-items: flex-end; gap: 10px; max-width: 720px; margin: 0 auto; padding: 10px 12px; border: 1px solid #d8dedc; border-radius: 14px; background: #fff; box-shadow: 0 4px 16px rgb(35 42 41 / 6%); }
  .composer-inner:focus-within { border-color: var(--primary); }
  .composer textarea { flex: 1; min-height: 30px; max-height: 120px; padding: 4px 6px; border: 0; outline: none; resize: none; background: transparent; font-size: 14px; }
  .composer .send { display: grid; width: 34px; height: 34px; place-items: center; border: 0; border-radius: 9px; background: var(--primary); color: #fff; }
  .composer .send:disabled { background: #c3d0ed; cursor: not-allowed; }

  /* 拖动分隔条 */
  .divider { flex: 0 0 7px; cursor: col-resize; background: transparent; position: relative; z-index: 5; }
  .divider::after { content: ""; position: absolute; left: 3px; top: 0; bottom: 0; width: 1px; background: var(--line); }
  .divider:hover, body.dragging .divider { background: var(--primary-soft); }
  body.dragging { cursor: col-resize; user-select: none; }

  /* 右侧引用/原文面板 */
  .source { flex: 0 0 auto; width: 0; min-width: 0; background: #fff; border-left: 1px solid var(--line); overflow: hidden; transition: width .18s ease; }
  .source-inner { display: flex; flex-direction: column; height: 100%; min-width: 0; }
  .source-head { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
  .source-head b { font-size: 14px; }
  .source-head .sub { color: var(--muted); font-size: 11.5px; }
  .source-head .close { margin-left: auto; display: grid; width: 28px; height: 28px; place-items: center; border: 0; border-radius: 7px; background: transparent; color: #8a9390; }
  .source-head .close:hover { background: #f0f2f1; }
  .back-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: #4a5552; font-size: 12px; }
  .back-btn:hover { border-color: var(--primary); color: var(--primary-strong); }

  .source-list { flex: 1; overflow-y: auto; padding: 8px 12px; }
  .src-item { display: flex; gap: 11px; width: 100%; padding: 12px 10px; border: 0; border-radius: 10px; background: transparent; text-align: left; }
  .src-item:hover { background: #f4f6f8; }
  .src-rank { display: grid; width: 22px; height: 22px; flex: 0 0 22px; place-items: center; border-radius: 50%; background: var(--primary-soft); color: var(--primary-strong); font-size: 11px; font-weight: 700; }
  .src-copy { flex: 1; min-width: 0; }
  .src-copy b { display: block; overflow: hidden; font-size: 12.5px; text-overflow: ellipsis; white-space: nowrap; }
  .src-copy .loc { color: var(--muted); font-size: 11px; }
  .src-pct { align-self: center; color: var(--primary-strong); font-size: 12px; font-weight: 700; white-space: nowrap; }
  .src-hint { color: #9aa29f; font-size: 11px; text-align: center; padding: 18px 0; }

  /* 原文查看 */
  .doc-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .doc-snippet { margin: 14px 16px 6px; padding: 12px 14px; border: 1px solid #e7eceb; border-left: 3px solid var(--primary); border-radius: 8px; background: #fafbfb; }
  .doc-snippet .t { color: #8a9390; font-size: 11px; margin-bottom: 6px; }
  .doc-snippet p { margin: 0; font-size: 13px; line-height: 1.7; color: #333c39; }
  .doc-snippet mark { background: var(--hit); padding: 0 3px; border-radius: 3px; }
  .pdf-box { flex: 1; margin: 10px 16px 16px; border: 1px solid var(--line); border-radius: 10px; background: #e9eceb; overflow-y: auto; }
  .pdf-box .bar { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: #fff; border-bottom: 1px solid var(--line); font-size: 11px; color: var(--muted); }
  .pdf-page { width: 92%; max-width: 480px; margin: 16px auto; padding: 34px 38px; background: #fff; border-radius: 3px; box-shadow: 0 6px 20px rgb(0 0 0 / 14%); color: #2c3331; font-size: 13px; line-height: 1.95; }
  .pdf-page h4 { margin: 0 0 12px; font-size: 15px; text-align: center; color: #1f2724; }
  .pdf-page .p { margin: 10px 0; }
  .pdf-page mark { background: var(--hit); padding: 1px 4px; border-radius: 3px; }
  .pdf-page .pageno { margin-top: 16px; padding-top: 10px; border-top: 1px solid #e6e9e8; color: #9aa29f; font-size: 11px; text-align: center; }
  .pdf-note { padding: 0 16px 14px; color: #9aa29f; font-size: 11px; text-align: center; }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="logo">H</span><span><b>HBCN 知识库工作台</b><small>Agentic RAG · 交互原型</small></span></div>
    <div class="modes">
      <button class="mode on" id="modeAI"><span class="dot"></span>AI 回答</button>
      <button class="mode on" id="modeKB"><span class="dot"></span>知识库检索</button>
    </div>
  </header>

  <div class="workspace" id="workspace">
    <main class="chat">
      <div class="chat-scroll" id="chatScroll">
        <div class="welcome" id="welcome">
          <div class="icon">✦</div>
          <h2>查证业务资料，结论可溯源</h2>
          <p>AI 生成回答并逐条溯源到原文；点「引用来源」在右侧查看并打开整本原文。</p>
          <div class="prompts">
            <button onclick="ask(this.textContent)">境外贷款提款前通常需要核对哪些材料？</button>
            <button onclick="ask(this.textContent)">如何处理材料中的制裁与受益所有人风险？</button>
            <button onclick="ask(this.textContent)">现有资料对人工终审有什么要求？</button>
          </div>
        </div>
        <div class="messages" id="messages"></div>
      </div>
      <div class="composer">
        <div class="composer-inner">
          <textarea id="input" rows="1" placeholder="描述你想核对的问题，按回车检索…"></textarea>
          <button class="send" id="send" title="搜索">🔍</button>
        </div>
      </div>
    </main>

    <div class="divider" id="divider"></div>

    <aside class="source" id="source">
      <div class="source-inner" id="sourceInner"></div>
    </aside>
  </div>
</div>

<script>
const SOURCES = [
  { name: '测试版授信函 - 中文空白.pdf', page: 1, score: 0.92, hit: '授信额度 USD 3,000,000.00，期限 12 个月', snippet: '授信额度 USD 3,000,000.00，期限 12 个月。提款前提：授信批复项下支持性材料齐备，担保手续办妥，并完成合规核查。' },
  { name: '商业合同 - 编造完.pdf', page: 2, score: 0.88, hit: '合同金额 USD 2,860,000.00，币种为美元', snippet: '本合同项下货物单价、数量与付款安排应与形式发票一致；合同金额 USD 2,860,000.00，币种为美元。' },
  { name: '形式发票 - 编造完.pdf', page: 1, score: 0.85, hit: '发票号码 INV-2024-0871', snippet: '商业发票号码 INV-2024-0871，货物为跨境采购设备，总金额与商业合同一致。' },
  { name: '提款指令 - 编造完.pdf', page: 1, score: 0.91, hit: '提款金额、币种与授信批复及合同一致', snippet: '收款人：智汇跨境贸易有限公司；提款金额、币种与授信批复及合同一致；请于提款日前确认资金用途。' },
  { name: 'DD notice (masked).pdf', page: 3, score: 0.83, hit: '需核查 UBO 并比对制裁名单与 PEP 名单', snippet: '交易对手含开曼群岛注册主体，需执行加强型尽调；需核查 UBO 并比对制裁名单与 PEP 名单。' },
];

const ANSWER = '根据知识库中的授信文件与提款流程资料，提款前应重点核对以下材料与要点：\n\n1. 授信批复与授信函：确认额度、期限、利率及提款前提条件与授信批复一致[1]。\n\n2. 支持性单据：商业合同、形式发票、报关单、运单需与贷款用途匹配，金额、币种与期限一致[2][3]。\n\n3. 支付与提款指令：提款指令、支付指令的收款人、金额、币种须与合同及授信一致[4]。\n\n4. 合规核查：交易对手涉及离岸主体的，需核查 UBO 并比对制裁名单与 PEP 名单[5]。\n\n以上为按知识库文件归纳的核对要点，请以正式授信批复与银行政策为准。';

const chatScroll = document.getElementById('chatScroll');
const messages = document.getElementById('messages');
const welcome = document.getElementById('welcome');
const input = document.getElementById('input');
const send = document.getElementById('send');
const source = document.getElementById('source');
const sourceInner = document.getElementById('sourceInner');
const divider = document.getElementById('divider');
const workspace = document.getElementById('workspace');
const modeAI = document.getElementById('modeAI');
const modeKB = document.getElementById('modeKB');

let busy = false;
let panelState = null; // 'list' | 'doc'

modeAI.addEventListener('click', () => {
  if (!modeKB.classList.contains('on') && modeAI.classList.contains('on')) return; // 至少留一个开
  modeAI.classList.toggle('on');
});
modeKB.addEventListener('click', () => {
  if (!modeAI.classList.contains('on') && modeKB.classList.contains('on')) return;
  modeKB.classList.toggle('on');
  if (!modeKB.classList.contains('on')) closePanel();
});

function parse(text) {
  const out = [];
  const re = /\[(\d+)\]/g; let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) out.push({ t: text.slice(last, m.index) });
    out.push({ c: Number(m[1]) });
    last = m.index + m[0].length;
  }
  if (last < text.length) out.push({ t: text.slice(last) });
  return out;
}

function segHtml(seg) {
  if (seg.c) return `<button class="cite" onclick="openDoc(${seg.c - 1})">${seg.c}</button>`;
  return seg.t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function ask(text) {
  if (busy) return;
  const q = (typeof text === 'string' ? text : input.value).trim();
  if (!q) return;
  const ai = modeAI.classList.contains('on');
  const kb = modeKB.classList.contains('on');
  if (!ai && !kb) return;

  input.value = '';
  welcome.classList.add('hidden');
  messages.insertAdjacentHTML('beforeend', `<div class="msg user"><div class="avatar user">我</div><div class="bubble-user"></div></div>`);
  const u = messages.lastElementChild.querySelector('.bubble-user'); u.textContent = q;

  if (kb && ai) renderAgentic(q);
  else if (kb) renderRetrieval(q);
  else renderAiOnly(q);
}

function renderAgentic(q) {
  busy = true;
  const box = document.createElement('div');
  box.className = 'msg';
  box.innerHTML = `<div class="avatar ai">✦</div><div class="msg-body"><div class="meta"><b>慧眼助手</b><span class="tag">知识库 · AI</span></div><div class="card"><div class="answer"></div></div></div>`;
  messages.appendChild(box);
  const ans = box.querySelector('.answer');
  scrollDown();
  let i = 0;
  const timer = setInterval(() => {
    i = Math.min(ANSWER.length, i + 3);
    ans.innerHTML = parse(ANSWER.slice(0, i)).map(segHtml).join('') + '<span class="caret"></span>';
    scrollDown();
    if (i >= ANSWER.length) {
      clearInterval(timer);
      const card = box.querySelector('.card');
      card.insertAdjacentHTML('beforeend', `<div class="answer-actions"><button class="src-btn" onclick="showList()">📚 引用来源（${SOURCES.length}）</button></div>`);
      busy = false;
    }
  }, 16);
}

function renderRetrieval(q) {
  const top = SOURCES.slice(0, 3);
  const items = top.map((s, i) => `<div style="padding:10px 0;border-bottom:1px solid #eef1f0"><b style="color:var(--primary-strong)">${i+1}. ${s.name}</b> <span style="color:var(--muted);font-size:11px">第 ${s.page} 页 · 相关性 ${Math.round(s.score*100)}%</span><p style="margin:6px 0 0;font-size:12.5px;line-height:1.7">${s.snippet}</p></div>`).join('');
  messages.insertAdjacentHTML('beforeend', `<div class="msg"><div class="avatar ai">✦</div><div class="msg-body"><div class="meta"><b>慧眼助手</b><span class="tag">纯检索</span></div><div class="card"><div style="font-size:13px;line-height:1.7">已检索到 ${SOURCES.length} 处相关原文，最相关片段如下：</div>${items}</div></div></div>`);
  scrollDown();
}

function renderAiOnly(q) {
  messages.insertAdjacentHTML('beforeend', `<div class="msg"><div class="avatar ai">✦</div><div class="msg-body"><div class="meta"><b>慧眼助手</b><span class="tag">通用 AI</span></div><div class="card"><div class="answer">可根据授信批复、贷款协议与合规要求进行核对，建议优先确认支持性材料与审批留痕是否齐备。（未启用知识库，此回答不引用原文。）</div></div></div></div>`);
  scrollDown();
}

function scrollDown() { requestAnimationFrame(() => { chatScroll.scrollTop = chatScroll.scrollHeight; }); }

function openPanel(w) {
  source.style.width = w + 'px';
  source.style.borderLeft = '1px solid var(--line)';
}

function closePanel() {
  panelState = null;
  source.style.width = '0';
  source.style.borderLeft = '0';
  sourceInner.innerHTML = '';
}

function showList() {
  panelState = 'list';
  openPanel(Math.min(400, window.innerWidth * 0.44));
  const rows = SOURCES.map((s, i) => `
    <button class="src-item" onclick="openDoc(${i})">
      <span class="src-rank">${i+1}</span>
      <span class="src-copy"><b>${s.name}</b><span class="loc">第 ${s.page} 页</span></span>
      <span class="src-pct">${Math.round(s.score*100)}%</span>
    </button>`).join('');
  sourceInner.innerHTML = `
    <div class="source-head"><div><b>引用来源</b><div class="sub">${SOURCES.length} 项 · 按相关性排序</div></div><button class="close" onclick="closePanel()">✕</button></div>
    <div class="source-list">${rows}<div class="src-hint">点击任意来源，在右侧展开原文</div></div>`;
}

function docPage(title, para, pageNo, hit) {
  return `<div class="pdf-page"><h4>${title}</h4><div class="p">${para}</div><div class="pageno">第 ${pageNo} 页</div></div>`;
}

function buildDoc(s) {
  const title = s.name;
  const pages = [];
  const total = 4;
  for (let p = 1; p <= total; p++) {
    let body;
    if (p === s.page) {
      body = escapeHtml(s.snippet).replace(escapeHtml(s.hit), `<mark>${escapeHtml(s.hit)}</mark>`);
    } else {
      body = p === 1
        ? '本文件为银行授信及贷款业务相关文件（演示占位）。正式使用中，此处为按页解析后的原文文本。'
        : '（第 ' + p + ' 页原文占位）本页为文档正文的后续内容，展示可上下滚动、逐页阅读整本文件的阅读体验。';
    }
    pages.push(docPage(title, body, p));
  }
  return pages.join('');
}

function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function openDoc(i) {
  const s = SOURCES[i];
  panelState = 'doc';
  openPanel(Math.min(680, window.innerWidth * 0.62));
  sourceInner.innerHTML = `
    <div class="source-head"><button class="back-btn" onclick="showList()">‹ 返回引用列表</button><button class="close" onclick="closePanel()">✕</button></div>
    <div class="doc-view">
      <div class="doc-snippet"><div class="t">命中片段（第 ${s.page} 页）</div><p>${escapeHtml(s.snippet).replace(escapeHtml(s.hit), `<mark>${escapeHtml(s.hit)}</mark>`)}</p></div>
      <div class="pdf-box">
        <div class="bar"><span>${s.name}</span><span>共 ${4} 页 · 上下滚动阅读整本</span></div>
        ${buildDoc(s)}
      </div>
      <div class="pdf-note">原型演示：正式版由 PDF 渲染引擎逐页显示真实原件，命中句高亮。</div>
    </div>`;
}

// 拖动分隔条
let dragging = false;
divider.addEventListener('mousedown', (e) => { dragging = true; e.preventDefault(); document.body.classList.add('dragging'); });
window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const rect = workspace.getBoundingClientRect();
  const rightW = rect.right - e.clientX;
  if (rightW > 240) openPanel(Math.min(rightW, rect.width * 0.75));
});
window.addEventListener('mouseup', () => { dragging = false; document.body.classList.remove('dragging'); });

// 输入提交
send.addEventListener('click', () => ask());
input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); } });
input.addEventListener('input', () => { send.disabled = !input.value.trim(); });
send.disabled = true;
</script>
</body>
