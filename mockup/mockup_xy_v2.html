<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智汇跨境贷途 · 跨境贷款文件智能审核台</title>
<style>
:root{
  --red:#DB0011; --red-bg:#fdeaea;
  --green:#16a34a; --green-bg:#e9f7ee;
  --amber:#d97706; --amber-bg:#fdf3e3;
  --gray:#9ca3af; --gray-bg:#f3f4f6;
  --ink:#1f2329; --ink2:#5c6470; --line:#e5e7eb;
  --bg:#f4f5f7; --card:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:13px;overflow:hidden;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#cfd4dc;border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}

/* ===== 顶栏 ===== */
header{height:52px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;flex-shrink:0;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-mark{width:26px;height:26px;border-radius:4px;background:var(--red);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;}
.logo-name{font-size:15px;font-weight:700;}
.logo-name em{font-style:normal;color:var(--red);}
nav{display:flex;gap:4px;margin-left:36px;height:100%;}
nav a{display:flex;align-items:center;padding:0 16px;cursor:pointer;color:var(--ink2);border-bottom:2.5px solid transparent;user-select:none;font-size:13.5px;}
nav a:hover{color:var(--ink);background:#fafafa;}
nav a.on{color:var(--red);border-bottom-color:var(--red);font-weight:600;}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:14px;}
.user{display:flex;align-items:center;gap:8px;color:var(--ink2);}
.avatar{width:26px;height:26px;border-radius:50%;background:#eef0f3;color:var(--ink2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:5px;padding:5px 12px;cursor:pointer;font-size:12.5px;}
.btn:hover{border-color:#c9cdd4;background:#fafafa;}
.btn-primary{background:var(--red);border-color:var(--red);color:#fff;}
.btn-primary:hover{background:#c2000f;}
.btn-primary:disabled{background:#f3b8bd;border-color:#f3b8bd;cursor:not-allowed;}
.btn-ghost-red{color:var(--red);border-color:#f0c2c6;background:#fff;}
.btn-ghost-red:hover{background:var(--red-bg);}
.btn-sm{padding:3px 9px;font-size:12px;}

/* ===== 页面容器 ===== */
main{height:calc(100vh - 52px);position:relative;}
.page{display:none;height:100%;overflow:auto;padding:18px 20px;}
.page.on{display:block;}
#page-case.on{display:flex;flex-direction:column;overflow:hidden;padding:0;}

/* ===== 灯 ===== */
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex-shrink:0;vertical-align:-1px;}
.dot.g{background:var(--green);} .dot.y{background:var(--amber);} .dot.r{background:var(--red);} .dot.w{background:#d1d5db;border:1px solid #b6bcc6;}
.lg{color:var(--green);font-weight:600;} .ly{color:var(--amber);font-weight:600;} .lr{color:var(--red);font-weight:600;} .lw{color:var(--ink2);font-weight:600;}
.lsum{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink2);}
.lsum .dot{width:8px;height:8px;}

/* ===== 待办页 ===== */
.stats-row{display:flex;gap:14px;margin-bottom:16px;}
.stat-card{flex:1;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 18px;}
.stat-card .n{font-size:26px;font-weight:700;line-height:1.2;}
.stat-card .l{color:var(--ink2);margin-top:3px;}
.stat-card.hl .n{color:var(--red);}
.case-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px 20px;display:flex;align-items:center;gap:22px;cursor:pointer;transition:box-shadow .15s;}
.case-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08);border-color:#d8dbe0;}
.cc-no{font-size:15px;font-weight:700;}
.cc-bor{color:var(--ink2);margin-top:3px;}
.cc-mid{flex:1;}
.cc-tags{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.tag{background:#f3f4f6;border-radius:4px;padding:2px 8px;color:var(--ink2);font-size:12px;}
.tag.red{background:var(--red-bg);color:var(--red);}
.cc-lights{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink2);min-width:210px;}
.cc-lights .row{display:flex;gap:12px;}
.status-chip{background:#eef4ff;color:#2b5fd9;border-radius:4px;padding:3px 10px;font-size:12px;font-weight:600;}

/* ===== 工作台布局 ===== */
.case-wrap{flex:1;min-height:0;display:flex;flex-direction:column;}
.three-col{flex:1;min-height:0;display:flex;gap:0;}
.col{overflow-y:auto;min-height:0;background:var(--bg);}
.col-left{width:264px;flex-shrink:0;border-right:1px solid var(--line);background:#fbfbfc;padding:12px;}
.col-mid{flex:1;min-width:0;padding:12px 14px;}
.col-right{width:384px;flex-shrink:0;border-left:1px solid var(--line);background:#fbfbfc;padding:12px;}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:10px;}
.panel-h{padding:9px 12px;border-bottom:1px solid var(--line);font-weight:600;display:flex;align-items:center;gap:8px;font-size:13px;}
.panel-b{padding:10px 12px;}

/* 左栏 */
.kv{display:flex;gap:8px;padding:3px 0;font-size:12.5px;}
.kv .k{width:70px;color:var(--ink2);flex-shrink:0;}
.kv .v{font-weight:500;word-break:break-all;}
.tree-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;cursor:pointer;color:var(--ink);font-size:12.5px;}
.tree-item:hover{background:#f0f1f4;}
.tree-item.on{background:var(--red-bg);color:var(--red);font-weight:600;}
.tree-sec{color:var(--ink2);font-size:11.5px;margin:10px 0 4px;font-weight:600;letter-spacing:.5px;}
.tree-item .ic{width:15px;height:15px;flex-shrink:0;}

/* 流程条 */
.flow{display:flex;align-items:stretch;gap:0;}
.flow-step{flex:1;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;position:relative;}
.flow-step h4{font-size:13px;margin-bottom:5px;display:flex;align-items:center;gap:8px;}
.flow-step .sub{color:var(--ink2);font-size:12px;line-height:1.7;}
.flow-arrow{display:flex;align-items:center;padding:0 8px;color:#b8bec8;font-size:20px;font-weight:700;}
.flow-note{background:var(--card);border:1px dashed #f0c2c6;border-radius:8px;padding:8px 14px;margin-top:8px;color:var(--ink2);font-size:12.5px;display:flex;gap:8px;align-items:flex-start;}
.flow-note b{color:var(--red);}
.note-ic{color:var(--red);font-weight:700;flex-shrink:0;}

/* 筛选 */
.filters{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;}
.f-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.f-row+.f-row{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
.f-label{color:var(--ink2);font-size:12px;margin-right:2px;}
.ftab{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2);user-select:none;}
.ftab:hover{border-color:#c9cdd4;}
.ftab.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.ftab.on.red{background:var(--red);border-color:var(--red);}
.f-count{font-weight:700;}
.f-right{margin-left:auto;}
.batch-btn{color:var(--ink2);font-size:12px;cursor:pointer;text-decoration:underline;}
.batch-btn:hover{color:var(--red);}

/* 校验列表 */
.chk{background:var(--card);border:1px solid var(--line);border-radius:7px;margin-bottom:7px;overflow:hidden;}
.chk.done{opacity:.92;}
.chk-row{display:flex;align-items:center;gap:9px;padding:8px 12px;cursor:pointer;}
.chk-row:hover{background:#fafafa;}
.chk-rule{font-weight:700;font-size:12px;color:var(--ink2);background:#f3f4f6;border-radius:4px;padding:1px 6px;flex-shrink:0;}
.chk-title{flex:1;font-size:12.8px;line-height:1.45;}
.chk-state{font-size:11.5px;border-radius:4px;padding:1px 7px;flex-shrink:0;}
.chk-state.pend{background:var(--amber-bg);color:var(--amber);}
.chk-state.auto{background:var(--green-bg);color:var(--green);}
.chk-state.done{background:#eef4ff;color:#2b5fd9;}
.chk-flash{animation:flash 1.6s ease 2;}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(219,0,17,0);}40%{box-shadow:0 0 0 3px rgba(219,0,17,.45);border-color:var(--red);}}
.chk-detail{border-top:1px solid var(--line);background:#fbfcfd;padding:11px 14px;display:none;}
.chk.open .chk-detail{display:block;}
.ai-line{display:flex;gap:8px;font-size:12.5px;color:var(--ink2);line-height:1.65;margin-bottom:8px;}
.ai-ic{flex-shrink:0;width:17px;height:17px;border-radius:4px;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;font-size:10.5px;display:flex;align-items:center;justify-content:center;font-weight:700;}
.loc-line{font-size:12px;color:var(--ink2);margin-bottom:10px;}
.loc-line b{color:var(--ink);}
.loc-btn{margin-bottom:10px;}
.dispose{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px;}
.dispose-t{font-size:12px;font-weight:600;margin-bottom:7px;}
.dispose .hint{font-size:11.5px;color:var(--ink2);margin-bottom:7px;line-height:1.6;}
textarea{width:100%;border:1px solid var(--line);border-radius:5px;padding:6px 8px;font-family:inherit;font-size:12.5px;resize:vertical;min-height:52px;outline:none;}
textarea:focus{border-color:var(--red);}
.d-btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.done-box{font-size:12.5px;line-height:1.7;}
.done-box .undo{color:#2b5fd9;cursor:pointer;text-decoration:underline;margin-left:6px;}
.chk-empty{color:var(--ink2);text-align:center;padding:26px 0;background:var(--card);border:1px dashed var(--line);border-radius:7px;}

/* 文档查看器 */
.doc-title{display:flex;align-items:center;gap:8px;}
.doc-badge{background:#f3f4f6;border-radius:4px;padding:1px 7px;font-size:11px;color:var(--ink2);font-weight:400;}
.fld{display:flex;gap:12px;padding:7px 10px;border-left:3px solid transparent;border-radius:5px;font-size:12.8px;}
.fld.ref{border-left-color:#f3c6c9;background:#fffafa;}
.fld .fk{width:150px;flex-shrink:0;color:var(--ink2);}
.fld .fv{flex:1;line-height:1.6;word-break:break-all;}
.fld.hl{background:var(--amber-bg);border-left-color:var(--red);animation:fldflash 1.5s ease 2;}
@keyframes fldflash{0%,100%{background:var(--amber-bg);}50%{background:#fbe0b6;}}
.fx-note{font-size:11.5px;color:var(--ink2);background:var(--gray-bg);border-radius:5px;padding:6px 10px;margin-bottom:8px;}
.sup-tb{width:100%;border-collapse:collapse;font-size:12.3px;}
.sup-tb th{background:#f7f8fa;color:var(--ink2);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);}
.sup-tb td{padding:6px 8px;border-bottom:1px solid #f0f1f3;}
.sup-ok{color:var(--green);}

/* 右栏 AI 面板 */
.risk{border:1px solid #f0d9a8;background:#fffaf0;border-radius:6px;padding:9px 11px;margin-bottom:8px;}
.risk.red{border-color:#f0c2c6;background:var(--red-bg);}
.risk-t{font-weight:600;font-size:12.5px;display:flex;gap:6px;align-items:center;margin-bottom:4px;}
.risk-b{font-size:12px;color:var(--ink2);line-height:1.65;}
.tpl-box{background:#fff;border:1px solid var(--line);border-radius:6px;padding:9px 11px;margin-top:8px;font-size:12.3px;line-height:1.75;white-space:pre-wrap;color:#3a4150;}
.tpl-box .tpl-cap{font-weight:600;color:var(--ink);margin-bottom:4px;}
.sel-info{background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12.3px;margin-bottom:8px;line-height:1.6;}
.sel-info .none{color:var(--ink2);}
.quick-btns{display:flex;gap:8px;flex-wrap:wrap;}

/* 支付指令表 */
.pay-sec{border-top:1px solid var(--line);background:var(--bg);flex-shrink:0;max-height:265px;overflow-y:auto;padding:10px 14px 12px;}
.pay-panel{background:var(--card);border:1px solid var(--line);border-radius:8px;}
.pay-h{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;font-weight:600;}
.fx-tag{font-size:11.5px;color:var(--ink2);background:var(--gray-bg);border-radius:4px;padding:2px 8px;font-weight:400;}
.pay-tb{width:100%;border-collapse:collapse;font-size:12.3px;}
.pay-tb th{background:#f7f8fa;color:var(--ink2);font-weight:600;text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
.pay-tb td{padding:7px 10px;border-bottom:1px solid #f0f1f3;vertical-align:top;}
.pay-tb tr.prow{cursor:pointer;}
.pay-tb tr.prow:hover{background:#fafafa;}
.badge-ai{display:inline-block;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;border-radius:3px;font-size:10px;padding:0 4px;margin-left:5px;font-weight:600;}
.diff{color:var(--red);font-weight:600;background:var(--red-bg);border-radius:3px;padding:0 4px;}
.pdet{background:#fbfcfd;}
.pdet td{padding:0;}
.pdet-in{padding:10px 14px;}
.pdet-tb{width:100%;border-collapse:collapse;font-size:12.2px;}
.pdet-tb th{background:#fff;color:var(--ink2);text-align:left;font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line);}
.pdet-tb td{padding:5px 8px;border-bottom:1px solid #f0f1f3;}
.ok-t{color:var(--green);}
.bad-t{color:var(--red);font-weight:600;}

/* 状态条 */
.status-bar{height:46px;flex-shrink:0;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 20px;}
.sb-lights{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);}
.sb-prog{font-size:12.5px;color:var(--ink2);}
.sb-prog b{color:var(--red);font-size:14px;}
.sb-btn{margin-left:auto;}

/* ===== 规则库页 ===== */
.mod-head{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-bottom:12px;display:flex;align-items:center;gap:16px;}
.mod-head h3{font-size:14px;}
.mod-head .sub{color:var(--ink2);font-size:12.5px;}
.rule-card{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden;}
.rc-h{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;}
.rc-h:hover{background:#fafafa;}
.rc-no{background:var(--ink);color:#fff;border-radius:4px;font-size:11.5px;font-weight:700;padding:2px 7px;flex-shrink:0;}
.rc-name{font-weight:600;font-size:13px;flex:1;}
.rc-pair{color:var(--ink2);font-size:11.5px;background:#f3f4f6;border-radius:4px;padding:2px 8px;}
.rc-b{border-top:1px solid var(--line);padding:11px 14px;background:#fbfcfd;display:none;}
.rule-card.open .rc-b{display:block;}
.rc-sec{margin-bottom:8px;}
.rc-sec .cap{font-size:11.5px;color:var(--ink2);font-weight:600;margin-bottom:3px;}
.rc-sec .txt{font-size:12.5px;line-height:1.7;}
.rc-hits{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.rc-view{margin-left:auto;}

/* ===== 审计页 ===== */
.aud-filters{display:flex;gap:8px;margin-bottom:14px;}
.tl{position:relative;padding-left:26px;}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line);}
.tl-item{position:relative;margin-bottom:14px;}
.tl-item::before{content:"";position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2.5px solid #9ca3af;}
.tl-item.sys::before{border-color:#2b5fd9;}
.tl-item.user::before{border-color:var(--red);}
.tl-card{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:10px 14px;}
.tl-time{font-size:11.5px;color:var(--ink2);margin-bottom:3px;display:flex;gap:10px;align-items:center;}
.tl-type{border-radius:3px;padding:0 5px;font-size:10.5px;font-weight:600;}
.tl-type.sys{background:#eef4ff;color:#2b5fd9;}
.tl-type.user{background:var(--red-bg);color:var(--red);}
.tl-text{font-size:12.8px;line-height:1.65;}

/* toast / modal */
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-8px);background:var(--ink);color:#fff;border-radius:6px;padding:9px 20px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:999;box-shadow:0 6px 20px rgba(0,0,0,.25);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#modal-mask{position:fixed;inset:0;background:rgba(20,22,26,.42);display:none;align-items:center;justify-content:center;z-index:998;}
#modal-mask.show{display:flex;}
#modal{background:#fff;border-radius:10px;width:460px;max-width:92vw;box-shadow:0 16px 50px rgba(0,0,0,.25);}
#modal .m-h{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px;}
#modal .m-b{padding:16px 18px;font-size:12.8px;line-height:1.7;color:var(--ink2);}
#modal .m-b textarea{margin-top:8px;min-height:70px;color:var(--ink);}
#modal .m-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
.req{color:var(--red);}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">汇</div>
    <div class="logo-name">智汇跨境贷途 <em>·</em> 跨境贷款文件智能审核台</div>
  </div>
  <nav id="nav">
    <a data-pg="todo" class="on">待办</a>
    <a data-pg="case">案件工作台</a>
    <a data-pg="rules">比对规则库</a>
    <a data-pg="audit">审计留痕</a>
  </nav>
  <div class="hdr-right">
    <div class="user"><div class="avatar">张</div>张敏 · 贷款运营专员</div>
    <button class="btn" onclick="resetDemo()">重置演示</button>
  </div>
</header>

<main>
  <!-- 页1 待办 -->
  <section class="page on" id="page-todo">
    <div class="stats-row">
      <div class="stat-card"><div class="n">1</div><div class="l">今日待办案件</div></div>
      <div class="stat-card"><div class="n ly">2</div><div class="l">待复核</div></div>
      <div class="stat-card hl"><div class="n lr">5</div><div class="l">违规拦截</div></div>
      <div class="stat-card"><div class="n">3</div><div class="l">本月已完成</div></div>
    </div>
    <div class="case-card" onclick="goPage('case')">
      <div class="cc-mid">
        <div class="cc-no">CASE-2026-0312 · 上海恒钢贸易有限公司</div>
        <div class="cc-bor">钢材采购流动资金贷款 · 提款人民币 2,000 万元 · 第一段（人民币循环贷款授信）</div>
        <div class="cc-tags">
          <span class="status-chip">两阶段预检完成 · 待人工处理</span>
          <span class="tag">授信函 FOL-2026-SH-0188</span>
          <span class="tag">申请书 1 份</span>
          <span class="tag">支付指令 4 笔</span>
          <span class="tag red">需人工处置 7 项</span>
        </div>
      </div>
      <div class="cc-lights">
        <div class="row"><span>模块一 · 授信申请核对</span><span class="lsum"><span class="dot g"></span>13 <span class="dot w"></span>1 <span class="dot r"></span>2</span></div>
        <div class="row"><span>模块二 · 支付指令核对</span><span class="lsum"><span class="dot g"></span>10 <span class="dot y"></span>1 <span class="dot r"></span>3</span></div>
        <div class="row"><span>AI 辅助识别</span><span class="lsum"><span class="dot g"></span>1 <span class="dot y"></span>1</span></div>
      </div>
      <button class="btn btn-primary" onclick="event.stopPropagation();goPage('case')">进入工作台</button>
    </div>

function chkDef(id){ for(var i=0;i<CHECKS_DEF.length;i++) if(CHECKS_DEF[i].id===id) return CHECKS_DEF[i]; return null; }

  var t=$("#toast"); t.textContent=msg; t.classList.add("show");

}

  ui.userClock++;

  return "2026-03-12 "+String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0");
}

/* 处置操作区（校验项内） */
function disposeHtml(d, st){
  if(st.st==="auto"){
    return '<div class="dispose"><div class="dispose-t">处置</div><div class="hint">🟢 规则校验符合，系统已自动放行，无需人工处理。</div></div>';
  }
  if(st.st==="done"){
    var act=st.act;
    return '<div class="dispose"><div class="dispose-t">处置结果</div><div class="done-box">'
      +'<span class="chk-state done">已处置 · '+esc(act.type)+'</span>　'+esc(act.time)
      +(act.note?'<br>说明/理由：'+esc(act.note):'')
      +'<br><span class="undo" onclick="undoChk(\''+d.id+'\')">撤销处置</span></div></div>';
  }
  if(d.l==="y"){
    return '<div class="dispose"><div class="dispose-t">处置 · 待复核</div><div class="hint">🟡 需填写复核说明后放行，或直接打回借款人。</div>'
      +'<textarea id="note-'+d.id+'" placeholder="复核说明（放行时必填），如：已联系借款人补充资金来源说明……"></textarea>'
      +'<div class="d-btns"><button class="btn btn-sm btn-primary" onclick="doPass(\''+d.id+'\')">复核后放行</button>'
      +'<button class="btn btn-sm btn-ghost-red" onclick="doReject(\''+d.id+'\')">打回借款人</button></div></div>';
  }
  return '<div class="dispose"><div class="dispose-t">处置 · 违规</div><div class="hint">🔴 默认拦截：只能「打回借款人」，或经授权「例外处理」（理由必填）。</div>'
    +'<div class="d-btns"><button class="btn btn-sm btn-ghost-red" onclick="doReject(\''+d.id+'\')">打回借款人</button>'
    +'<button class="btn btn-sm" onclick="doException(\''+d.id+'\')">授权例外（理由必填）</button></div></div>';
}
function requireNote(id){
  var el=document.getElementById("note-"+id);
  return el ? (el.value||"").trim() : "";
}
function doPass(id){
  var d=chkDef(id), note=requireNote(id);
  if(!note){ toast("请先填写复核说明"); document.getElementById("note-"+id).style.borderColor="var(--red)"; return; }
  var t=userTime();
  chkState(id).st="done"; chkState(id).act={type:"复核后放行", note:note, time:t};
  addAudit("对 "+d.rule+" 执行「复核后放行」，复核说明："+note);
  toast(d.rule+" 已放行");
  renderMid(); renderPay();
}
function doReject(id){
  var d=chkDef(id);
  var t=userTime();
  showModal("打回借款人","确认将 <b>"+esc(d.rule)+" · "+esc(d.t)+"</b> 打回借款人整改？<textarea id='modal-note' placeholder='打回说明（选填）'></textarea>",function(){
    var note=((document.getElementById("modal-note")||{}).value||"").trim();
    chkState(id).st="done"; chkState(id).act={type:"打回借款人", note:note, time:t};
    addAudit("对 "+d.rule+" 执行「打回借款人」");
    toast(d.rule+" 已打回");
    renderMid(); renderPay();
  },"确认打回");
}
function doException(id){
  var d=chkDef(id);
  showModal("授权例外","对 <b>"+esc(d.rule)+" · "+esc(d.t)+"</b> 进行授权例外处理，例外理由<span class=\"req\">必填</span>：",function(reason){
    var t=userTime();
    chkState(id).st="done"; chkState(id).act={type:"授权例外", note:reason, time:t};
    addAudit("对 "+d.rule+" 执行「授权例外」，理由："+reason);
    toast(d.rule+" 已授权例外");
    renderMid(); renderPay();
  },"确认例外",true,"请输入例外理由（必填）");
}
function undoChk(id){
  var d=chkDef(id);
  chkState(id).st="pending"; chkState(id).act=null;
  addAudit("撤销了对 "+d.rule+" 的处置，恢复待处理");
  renderMid(); renderPay();
}
function batchRestore(){
  showModal("批量恢复待处理","确认将全部校验项恢复为初始状态（🟢 自动放行、🟡/🔴 待处理，进度归零）？此操作用于演示回退。",function(){
    state.checks.forEach(function(c){
      var d=chkDef(c.id);
      c.st = d.l==="g" ? "auto" : "pending";
      c.act=null;
    });
    state.submitted=false;
    addAudit("执行「批量恢复待处理」演示回退");
    toast("已恢复待处理");
    renderMid(); renderPay();
  },"确认恢复");
}

function quickPass(){
  var sel=ui.selChk?chkDef(ui.selChk):null;
  if(!sel){ toast("请先在中栏选择校验项"); return; }
  if(sel.l==="g"){ toast("绿项已自动放行，无需处置"); return; }
  if(sel.l==="r"){ toast("违规项不能直接放行，请打回或授权例外"); return; }
  doPass(sel.id);
}
function quickReject(){
  var sel=ui.selChk?chkDef(ui.selChk):null;
  if(!sel){ toast("请先在中栏选择校验项"); return; }
  if(sel.l==="g"){ toast("绿项已自动放行，无需打回"); return; }
  doReject(sel.id);
}
function quickRequest(){

function quickNote(){

  addAudit("添加案件备注："+v);

}

function renderStatus(){
  var c=counts(null);
  var done=doneCount(), total=PENDING_TOTAL();
  var btn = state.submitted
    ? '<button class="btn btn-primary sb-btn" disabled>已提交审批</button>'
    : '<button class="btn btn-primary sb-btn" '+(done===total?'':'disabled')+' onclick="submitAll()">提交审批</button>';
  $("#status-bar").innerHTML='<div class="sb-lights">'
    +'<span class="lsum"><span class="dot g"></span>通过 <b class="lg">'+c.g+'</b> 自动放行</span>'
    +'<span class="lsum"><span class="dot y"></span>待复核 <b class="ly">'+c.y+'</b></span>'
    +'<span class="lsum"><span class="dot r"></span>违规拦截 <b class="lr">'+c.r+'</b></span>'
    +'<span class="lsum"><span class="dot w"></span>忽略 <b class="lw">'+c.w+'</b></span>'
    +'<span class="lsum">共 <b>'+ (c.g+c.y+c.r+c.w) +'</b> 项</span></div>'
    +'<div class="sb-prog">人工处理进度 <b>'+done+'</b> / '+total+'（🟡'+c.y+' + 🔴'+c.r+'）</div>'
    +btn;
}
function submitAll(){
  var done=doneCount(), total=PENDING_TOTAL();
  if(done<total){ toast("尚有 "+(total-done)+" 项待处理未处置"); return; }
  showModal("提交审批","确认提交 CASE-2026-0312 审批？<br>7 项待处理已全部处置完毕（🟡2 已复核放行 / 🔴5 已打回或授权例外），提交后写入审计留痕。",function(){
    state.submitted=true;
    addAudit("提交审批（7 项待处理全部处置完毕）");
    toast("已提交审批");
    renderMid(); renderPay();
  },"确认提交");
}

function renderRules(){
  var h='<div class="mod-head"><h3>模块一 · 授信申请阶段核对</h3><span class="sub">16 条规则（申请书 vs 授信函/贷款合同 15 条 + 申请书自检 1 条） · 本案命中 16 项结果</span></div>';
  h+=rulesHtml(RULES_M1);
  h+='<div class="mod-head"><h3>模块二 · 支付指令阶段核对</h3><span class="sub">5 条规则（支付指令 vs 申请书 4 条 + 支付指令 vs 授信函 1 条） · 本案命中 14 项结果</span></div>';
  h+=rulesHtml(RULES_M2);
  $("#page-rules").innerHTML=h;
}
function rulesHtml(rules){
  var h="";
  rules.forEach(function(r){
    var hits=allDefs().filter(function(d){ return d.rule===r.no; });
    var hc={g:0,y:0,r:0,w:0};
    hits.forEach(function(d){ hc[d.l]++; });
    var hitStr = hits.length===0 ? "未命中" : ("命中 "+hits.length+" 项：");
    var dots = (hc.g?'<span class="lsum"><span class="dot g"></span>'+hc.g+'</span>':'')+(hc.y?'<span class="lsum"><span class="dot y"></span>'+hc.y+'</span>':'')+(hc.r?'<span class="lsum"><span class="dot r"></span>'+hc.r+'</span>':'')+(hc.w?'<span class="lsum"><span class="dot w"></span>'+hc.w+'</span>':'');
    h+='<div class="rule-card" id="rule-'+r.no+'"><div class="rc-h" onclick="this.parentNode.classList.toggle(\'open\')">'
      +'<span class="rc-no">'+r.no+'</span><span class="rc-name">'+esc(r.name)+'</span>'
      +'<span class="rc-pair">'+esc(r.pair)+'</span>'
      +'<div class="rc-hits"><span style="color:var(--ink2);font-size:12px;">'+hitStr+'</span>'+dots+'</div>'
      +'<button class="btn btn-sm rc-view" onclick="event.stopPropagation();viewRule(\''+r.no+'\')">查看本案校验项</button>'
      +'</div><div class="rc-b">'
      +'<div class="rc-sec"><div class="cap">比对标准</div><div class="txt">'+esc(r.std)+'</div></div>'
      +'<div class="rc-sec"><div class="cap">本案命中情况</div><div class="txt">'+(hits.length? hits.map(function(d){ return '<span class="lsum">'+dot(d.l)+'</span> '+d.rule+'：'+esc(d.t); }).join('<br>') : '未命中')+'</div></div>'
      +'</div></div>';
  });
  return h;
}
function viewRule(no){
  goPage("case");
  ui.module = ruleModule(no); ui.light="all"; ui.openChk=null;
  renderMid();
  var first=allDefs().filter(function(d){ return d.rule===no; })[0];
  if(first){
    ui.openChk=first.id; ui.selChk=first.id;
    renderMid();
    var el=document.getElementById("chk-"+first.id);
    if(el){ el.scrollIntoView({behavior:"smooth", block:"center"}); el.classList.add("chk-flash"); setTimeout(function(){ el.classList.remove("chk-flash"); },3400); }
  }
}

    t+='<div class="tl-item '+e.type+'"><div class="tl-card"><div class="tl-time"><span>'+e.time+'</span><span class="tl-type '+e.type+'">'+(e.type==="sys"?"系统事件":"人工操作")+'</span></div><div class="tl-text">'+esc(e.text)+'</div></div></div>';
  });

}
