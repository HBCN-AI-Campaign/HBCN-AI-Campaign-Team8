        } else if (event.type === "text") {
          answer += event.text || event.delta || "";
        } else if (event.type === "error") addTimeline("error", "\u52A9\u624B\u670D\u52A1\u62A5\u9519", event.message || "\u8BF7\u6C42\u672A\u5B8C\u6210", "\u4E1A\u52A1\u72B6\u6001\u672A\u66F4\u6539");
        else if (event.type === "done" && answer) addTimeline("assistant", "AI \u52A9\u624B", answer, steps + " \u4E2A\u53EF\u5BA1\u8BA1\u6B65\u9AA4");
      }
      if (done) break;
    }
    if (buffer.startsWith("data:")) {
      try {
        const event = JSON.parse(buffer.slice(5).trim());
        if (event.type === "text") answer += event.text || "";
      } catch {
      }
    }
    if (answer && !steps) addTimeline("assistant", "AI \u52A9\u624B", answer, "\u670D\u52A1\u7AEF\u56DE\u590D \xB7 \u53EA\u8BFB\u4E0A\u4E0B\u6587");
  }
  async function stopAssistant() {
    if (state.controller) {
      state.controller.abort();
      state.controller = null;
    }
    if (state.sessionId) try {
      await fetch("/api/assistant/abort", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sessionId: state.sessionId }) });
    } catch {
    }
    toast("\u5DF2\u505C\u6B62\u672C\u6B21\u52A9\u624B\u56DE\u590D");
  }
  function renderKnowledge() {
    const items = data.knowledge || [];
    $("#main").innerHTML = '<button class="back-link" data-return>\u2190 \u8FD4\u56DE\u7533\u8BF7</button><section class="page-head"><div><p class="eyebrow">\u5168\u7AD9\u6838\u5BF9\u4F9D\u636E</p><h1>\u89C4\u5219\u4E0E\u77E5\u8BC6</h1><p class="subhead">\u6765\u6E90\u3001\u9002\u7528\u8303\u56F4\u53CA\u590D\u6838\u72B6\u6001</p></div></section><section class="knowledge-list">' + items.map((item) => '<details class="knowledge-item"><summary><span>' + esc(item.category) + "</span><strong>" + esc(item.title) + "</strong><span>" + esc(item.article) + "</span></summary><p>" + esc(item.summary) + "</p><p>" + esc(item.authority) + " \xB7 " + esc(item.status) + "</p><small>\u76F8\u5173\u5EA6 " + Math.round(item.relevance * 100) + "% \xB7 \u4EC5\u8868\u793A\u6F14\u793A\u5173\u8054\u7A0B\u5EA6</small></details>").join("") + '</section><section class="section-block"><h2>\u5F53\u524D\u6838\u5BF9\u6E05\u5355</h2><p>\u6BCF\u6761\u89C4\u5219\u4FDD\u7559\u539F\u8868 Sheet1 \u884C\u53F7\u4E0E\u7248\u672C\u3002\u6CD5\u57DF\u53CA\u4EA7\u54C1\u9002\u7528\u6027\u9700\u5BA1\u6838\u4EBA\u5458\u786E\u8BA4\u3002</p><div class="rule-table">' + RULES.map((item) => "<div><strong>" + item.row + " \xB7 " + esc(item.fieldA) + "</strong><span>" + esc(item.explain) + "</span></div>").join("") + "</div></section>";
    $("[data-return]").onclick = () => navigate("cases");
  }
  async function inspectConnection() {
    try {
      const response = await fetch("/api/status", { headers: { "Accept": "application/json" } });
      if (!response.ok) throw new Error();
      const status = await response.json();
      state.status = "connected";
      toast(status.connected || status.opencode?.connected ? "\u5DF2\u8FDE\u63A5\u52A9\u624B\u670D\u52A1" : "\u7F51\u5173\u5728\u7EBF\uFF0C\u6A21\u578B\u72B6\u6001\u5F85\u786E\u8BA4");
    } catch {
      state.status = "offline";
      toast("\u5F53\u524D\u4F7F\u7528\u672C\u5730\u6F14\u793A \xB7 \u6CA1\u6709\u8C03\u7528\u771F\u5B9E\u6A21\u578B");
    }
  }
  if (typeof document !== "undefined") shell();
})();
</script></body></html>
